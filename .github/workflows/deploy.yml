# deploy.yml — main 分支：校验 → 构建 → 发布到 GitHub Pages
#
# 契约：docs/pipeline-spec.md §7（build 契约）与 §8（CI 契约）
#
# ★ 授权闸门在 CI 上的落地方式：
#   validate 是独立 job，build 与 deploy 通过 `needs:` 串在它后面。
#   validate.py 一旦退出非 0（例如某讲座 output_mode="transcript" 而
#   course.toml 里 license.verified != true），validate job 直接失败，
#   build / deploy **不会被执行**，站点不会更新。这是"部署在闸门失败时
#   不可能发生"的保证，而不是靠人工自觉。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 官方部署要求：pages: write 发布，id-token: write 用于 OIDC 校验
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署跑；不取消进行中的部署（避免线上出现半成品站点）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ① 闸门：失败则后面全部不执行。
  # ★ 这里必须把**全部**闸门都跑一遍，不能只跑 validate.py ——
  #   .github/workflows/validate.yml 与本工作流是**各自独立**触发的，
  #   它失败挡不住本工作流。若这里不跑全套，一次违规提交照样能部署上线。
  validate:
    name: 校验（授权 / 文风 / 内容审计 / 配图房规）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 授权与术语闸门
        run: python scripts/validate.py --root . --quiet

      - name: 文风机检
        run: python scripts/check_style.py --root .

      - name: 内容审计
        run: python scripts/audit_content.py --root . --strict

      - name: 配图房规
        run: python scripts/check_figures.py --root . --strict

  # ② 构建（MkDocs Material）
  build:
    name: 构建站点（MkDocs Material）
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: websrc/requirements.txt

      # 渲染器是 MkDocs Material，依赖钉在 websrc/requirements.txt。
      # （历史上曾用自带的 scripts/build.py 零依赖渲染器，已弃用。）
      - name: 安装站点依赖
        run: pip install -r websrc/requirements.txt

      # enablement: true —— 若仓库尚未启用 Pages，本步会自己启用。
      # 否则每建一门新课都得先人工去 Settings 打开 Pages，否则这里直接失败。
      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # build_site.py：先跑 validate 闸门 → 生成 websrc/docs/ → 调 mkdocs --strict。
      # 它自己设 PYTHONPATH=websrc 与 COURSELINGO_BASE_DIR；
      # site_url 取自 course.toml 的 [site].url（含项目站点的 /<repo>/ 前缀）。
      - name: 构建站点
        run: python scripts/build_site.py --root . --out site-mkdocs

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-mkdocs

  # ③ 发布：只有 build（因而也只有 validate）成功才会走到这里
  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
