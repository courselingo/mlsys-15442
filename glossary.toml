# CourseLingo 术语表 · CMU Machine Learning Systems
# 格式见平台仓库 docs/pipeline-spec.md。术语一致率由 validate.py 校验。
#
# 加词原则：只收**会在正文里反复出现、且译法容易漂移**的词。
# 太通用的英文词（data / model / system 单用）不收 —— 它们会在漂移检查里
# 命中每一段英文缩写，制造大量假警告。

[[term]]
key = "machine learning system"
zh = "机器学习系统"
en = "machine learning system"
note = "把模型、数据、算力放在一起看的那一层；关心的不是某个算法准不准，而是整条链路跑不跑得起来"

[[term]]
key = "automatic differentiation"
zh = "自动微分"
en = "automatic differentiation"
note = "由程序结构本身推导梯度，而不是手写求导公式"

[[term]]
key = "computational graph"
zh = "计算图"
en = "computational graph"
note = "把计算表示成有向图，节点是算子、边是张量，反向传播沿图反向走"

[[term]]
key = "ml framework"
zh = "机器学习框架"
en = "ML framework"
note = "把算子、张量、自动微分与硬件调度包成一套接口的软件层，例如 PyTorch"

[[term]]
key = "kernel"
zh = "内核（GPU 核函数）"
en = "kernel"
note = "在 GPU 上并行执行的一段函数；注意与操作系统内核同名但不同义"

[[term]]
key = "compute"
zh = "算力"
en = "compute"
note = "单位时间能做多少次浮点运算；在 ML 系统里它和内存带宽是两个不同的瓶颈"

[[term]]
key = "hardware accelerator"
zh = "硬件加速器"
en = "hardware accelerator"
note = "为特定计算模式特化的芯片，例如 GPU 与 TPU；换硬件常常比改模型更有效"

[[term]]
key = "tensor core"
zh = "张量核心"
en = "Tensor Core"
note = "GPU 上专门做小矩阵乘加的电路单元，是 2016 年后算力曲线抬头的直接原因"

[[term]]
key = "convolutional neural network"
zh = "卷积神经网络"
en = "convolutional neural network"
note = "用滑窗卷积提取局部特征的网络；AlexNet 就是它把 ImageNet 分类误差砍下来的"

[[term]]
key = "gradient descent"
zh = "梯度下降"
en = "gradient descent"
note = "沿损失函数的负梯度方向更新参数；它的每一步都要求一次完整的反向传播"

[[term]]
key = "pruning"
zh = "剪枝"
en = "pruning"
note = "把模型里贡献小的权重或通道去掉，用更少的计算换同一档准确率"

[[term]]
key = "knowledge distillation"
zh = "知识蒸馏"
en = "knowledge distillation"
note = "让一个小模型去模仿大模型的输出分布，把大模型的能力压进小模型"

[[term]]
key = "inference engine"
zh = "推理引擎"
en = "inference engine"
note = "专门负责把训好的模型跑快的那一层：算子融合、内存复用、批处理调度都在这里"

[[term]]
key = "latency"
zh = "延迟"
en = "latency"
note = "一次请求从进到出花掉的时间；它和吞吐量是两个方向的指标，常常互相牺牲"

[[term]]
key = "throughput"
zh = "吞吐量"
en = "throughput"
note = "单位时间能处理多少请求；提高它靠批处理，而批处理会推高单次延迟"

[[term]]
key = "end-to-end"
zh = "端到端"
en = "end-to-end"
note = "把整条链路当成一个整体来优化，而不是逐段各自调到最好"

[[term]]
key = "data parallelism"
zh = "数据并行"
en = "data parallelism"
note = "把同一份模型复制到多个设备，各自处理不同的数据分片"

[[term]]
key = "ZeRO"
zh = "零冗余优化器"
en = "Zero Redundancy Optimizer"
note = "把优化器状态、梯度、参数分片存放，消除数据并行中的冗余副本"

[[term]]
key = "KV cache"
zh = "KV 缓存"
en = "KV cache"
note = "自回归生成时缓存已算过的键值对，避免每步重算整个前缀"

[[term]]
key = "operator"
zh = "算子"
en = "operator"
note = "对张量做一次基本运算的东西，例如矩阵乘、卷积、softmax；它是计算图里的计算节点"

[[term]]
key = "tensor"
zh = "张量"
en = "tensor"
note = "多维数组，是算子吃进去、吐出来的东西；计算图里的边就是张量"
