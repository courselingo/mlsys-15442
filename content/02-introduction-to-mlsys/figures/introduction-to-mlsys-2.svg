<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -1.0 758 266.0" width="758" height="266.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-2-title fig-introduction-to-mlsys-2-desc">
  <title id="fig-introduction-to-mlsys-2-title">一台训练节点：一个 CPU 加四块 GPU</title>
  <desc id="fig-introduction-to-mlsys-2-desc">节点里有一个 CPU、四块 GPU，每块 GPU 带自己的 HBM 显存，主机侧另有 DRAM；课件用这张图强调数据要在不同层级的存储之间来回搬。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="-1.0" width="758" height="266.0" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一台训练节点：一个 CPU 加四块 GPU</text>
  <rect x="25" y="56" width="712" height="186" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="38" y="73.85" font-size="11" fill="#64748b">一台训练节点</text>
  <rect x="45" y="95" width="644" height="39" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="367.0" y="119.0" font-size="13" fill="#1e40af" text-anchor="middle">CPU 与主机内存（DRAM）</text>
  <rect x="45" y="159" width="140" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="115.0" y="188.7" font-size="15" fill="#b45309" text-anchor="middle">GPU 0</text>
  <text x="115.0" y="206.7" font-size="12" fill="#b45309" text-anchor="middle">HBM 显存</text>
  <rect x="213" y="159" width="140" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="283.0" y="188.7" font-size="15" fill="#b45309" text-anchor="middle">GPU 1</text>
  <text x="283.0" y="206.7" font-size="12" fill="#b45309" text-anchor="middle">HBM 显存</text>
  <rect x="381" y="159" width="140" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="451.0" y="188.7" font-size="15" fill="#b45309" text-anchor="middle">GPU 2</text>
  <text x="451.0" y="206.7" font-size="12" fill="#b45309" text-anchor="middle">HBM 显存</text>
  <rect x="549" y="159" width="140" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="619.0" y="188.7" font-size="15" fill="#b45309" text-anchor="middle">GPU 3</text>
  <text x="619.0" y="206.7" font-size="12" fill="#b45309" text-anchor="middle">HBM 显存</text>
</svg>
