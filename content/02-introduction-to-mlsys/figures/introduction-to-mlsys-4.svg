<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 798 148.0" width="798" height="148.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-4-title fig-introduction-to-mlsys-4-desc">
  <title id="fig-introduction-to-mlsys-4-title">DNN 拆开看只有两样东西：张量与算子</title>
  <desc id="fig-introduction-to-mlsys-4-desc">一张计算图由张量（n 维数组）和算子（卷积、矩阵乘这类张量代数运算）交替组成，串起来就能解复杂任务。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="798" height="148.0" fill="#ffffff"/>

  <text x="401.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">DNN 拆开看只有两样东西：张量与算子</text>
  <rect x="25" y="70" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="89.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">张量 x</text>
  <text x="89.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">n 维数组</text>
  <rect x="181" y="70" width="128" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="245.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">算子</text>
  <text x="245.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">卷积、矩阵乘</text>
  <rect x="337" y="70" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="401.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">张量 y</text>
  <text x="401.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">n 维数组</text>
  <rect x="493" y="70" width="128" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="557.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">算子</text>
  <text x="557.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">激活、加法</text>
  <rect x="649" y="70" width="128" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="713.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">张量 z</text>
  <text x="713.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">n 维数组</text>
  <path d="M158,104 L170,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M314,104 L326,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470,104 L482,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M626,104 L638,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
