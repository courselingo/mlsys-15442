<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 810 311.0" width="810" height="311.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-5-title fig-introduction-to-mlsys-5-desc">
  <title id="fig-introduction-to-mlsys-5-title">图级优化：把能合并的算子合并</title>
  <desc id="fig-introduction-to-mlsys-5-desc">上排是原始计算图，卷积之后紧跟一个归一化；下排把两者合并成一个算子。两张图算的是同一件事，代价不一样。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="810" height="311.0" fill="#ffffff"/>

  <text x="407.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">图级优化：把能合并的算子合并</text>
  <rect x="25" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">Input</text>
  <text x="110.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">输入张量</text>
  <rect x="223" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">conv3x3</text>
  <text x="308.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">卷积</text>
  <rect x="421" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">batchnorm</text>
  <text x="506.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">逐通道归一化</text>
  <rect x="619" y="70" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="704.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">relu</text>
  <text x="704.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">激活</text>
  <path d="M200,104 L212,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M398,104 L410,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M596,104 L608,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="166" width="210" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">Input</text>
  <text x="130.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">输入张量</text>
  <rect x="263" y="166" width="210" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="368.0" y="195.7" font-size="15" fill="#b45309" text-anchor="middle">conv3x3 + batchnorm</text>
  <text x="368.0" y="213.7" font-size="12" fill="#b45309" text-anchor="middle">合并成一个算子</text>
  <rect x="501" y="166" width="210" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="606.0" y="195.7" font-size="15" fill="#166534" text-anchor="middle">relu</text>
  <text x="606.0" y="213.7" font-size="12" fill="#166534" text-anchor="middle">激活</text>
  <path d="M240,200 L252,200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M478,200 L490,200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="262" width="764" height="39" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="407.0" y="286.1" font-size="13" fill="#6b21a8" text-anchor="middle">同一份结果，两张等价但代价不同的图</text>
</svg>
