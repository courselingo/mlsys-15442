<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 732 232.0" width="732" height="232.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-8-title fig-introduction-to-mlsys-8-desc">
  <title id="fig-introduction-to-mlsys-8-title">图优化规则库的三个局限</title>
  <desc id="fig-introduction-to-mlsys-8-desc">课件列了三条：鲁棒性上经验规则不覆盖所有模型与硬件，可扩展性上新算子与新图结构都要再写规则，性能上会错过针对特定硬件的细粒度优化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="732" height="232.0" fill="#ffffff"/>

  <text x="368.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">图优化规则库的三个局限</text>
  <rect x="25" y="70" width="686" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="368.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">规则库的三个局限</text>
  <rect x="25" y="138" width="210" height="84" fill="#fce7f3" stroke="#ec4899"/>
  <text x="130.0" y="166.6" font-size="14" fill="#9d174d" text-anchor="middle">鲁棒性</text>
  <text x="130.0" y="184.6" font-size="12" fill="#9d174d" text-anchor="middle">经验规则并不适用于</text>
  <text x="130.0" y="202.6" font-size="12" fill="#9d174d" text-anchor="middle">所有模型与硬件</text>
  <rect x="263" y="138" width="210" height="84" fill="#fce7f3" stroke="#ec4899"/>
  <text x="368.0" y="166.6" font-size="14" fill="#9d174d" text-anchor="middle">可扩展性</text>
  <text x="368.0" y="184.6" font-size="12" fill="#9d174d" text-anchor="middle">新算子与新图结构</text>
  <text x="368.0" y="202.6" font-size="12" fill="#9d174d" text-anchor="middle">都要再写新规则</text>
  <rect x="501" y="138" width="210" height="84" fill="#fce7f3" stroke="#ec4899"/>
  <text x="606.0" y="166.6" font-size="14" fill="#9d174d" text-anchor="middle">性能</text>
  <text x="606.0" y="184.6" font-size="12" fill="#9d174d" text-anchor="middle">会错过针对特定模型</text>
  <text x="606.0" y="202.6" font-size="12" fill="#9d174d" text-anchor="middle">与硬件的细粒度优化</text>
  <path d="M130,117 L130,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M368,117 L368,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M606,117 L606,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
