<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 634 337.0" width="634" height="337.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-6-title fig-introduction-to-mlsys-6-desc">
  <title id="fig-introduction-to-mlsys-6-title">归一化为什么能折进卷积：它本身是逐通道的仿射变换</title>
  <desc id="fig-introduction-to-mlsys-6-desc">卷积输出 Y 之后做一次逐通道的归一化得到 Z；因为归一化也是仿射的，两次仿射可以合成一次，于是权重与偏置各自被缩放平移一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="634" height="337.0" fill="#ffffff"/>

  <text x="319.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">归一化为什么能折进卷积：它本身是逐通道的仿射变换</text>
  <rect x="25" y="70" width="280" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="165.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">Y = Conv2D(X, W)</text>
  <text x="165.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">一次卷积</text>
  <rect x="25" y="163" width="280" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="165.0" y="192.7" font-size="15" fill="#b45309" text-anchor="middle">Z = (Y − R) / P</text>
  <text x="165.0" y="210.7" font-size="12" fill="#b45309" text-anchor="middle">逐通道归一化</text>
  <rect x="333" y="163" width="280" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="473.0" y="192.7" font-size="15" fill="#166534" text-anchor="middle">Z = Conv2D(X, W2) + B2</text>
  <text x="473.0" y="210.7" font-size="12" fill="#166534" text-anchor="middle">折成一次卷积</text>
  <path d="M165,143 L165,152" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310,197 L322,197" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="259" width="588" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="319.0" y="288.7" font-size="15" fill="#6b21a8" text-anchor="middle">W2 = W / P，B2 = B / P − R / P</text>
  <text x="319.0" y="306.7" font-size="12" fill="#6b21a8" text-anchor="middle">R 与 P 是归一化在推理时的两个常量，与 X 无关</text>
</svg>
