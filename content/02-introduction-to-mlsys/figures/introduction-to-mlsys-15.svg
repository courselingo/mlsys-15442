<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-introduction-to-mlsys-15-title fig-introduction-to-mlsys-15-desc">
  <title id="fig-introduction-to-mlsys-15-title">同一套栈，训练与推理的瓶颈不一样</title>
  <desc id="fig-introduction-to-mlsys-15-desc">训练侧要存权重、梯度、优化器状态与激活，瓶颈在显存和通信；推理侧不存梯度与优化器状态，但多了随序列长度增长的键值缓存，瓶颈在显存访问与单次延迟。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一套栈，训练与推理的瓶颈不一样</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一套栈，两边压的地方不同</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">训练侧</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">权重、梯度、优化器状态、激活</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">推理侧</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">权重与键值缓存，不存梯度</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">训练关心「多久训完」，推理关心「单个请求多快返回」</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以同一层在两侧的取舍方向可以完全相反</text>
</svg>
