<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-6-title fig-memory-optimization-6-desc">
  <title id="fig-memory-optimization-6-title">混合精度：不是全都降到 16 位</title>
  <desc id="fig-memory-optimization-6-desc">做法是大部分层用 16 位，但把对数值敏感的少数地方留在 32 位；课件举的例子是线性层用 f16、softmax 用 f32。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">混合精度：不是全都降到 16 位</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">大部分用 16 位，敏感的地方留 32 位</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">线性层</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">用 f16</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">softmax</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">用 f32</text>
  <rect x="25" y="234" width="686" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="368.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件在这一页点了一句</text>
  <text x="368.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">有些层对精度更敏感</text>
</svg>
