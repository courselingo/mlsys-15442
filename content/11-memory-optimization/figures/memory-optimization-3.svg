<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-3-title fig-memory-optimization-3-desc">
  <title id="fig-memory-optimization-3-title">检查点：只把一部分中间值留下</title>
  <desc id="fig-memory-optimization-3-desc">做法是在前向时只保存少数几个节点（课件叫它们着色的节点），其余的在反向需要时，再从最近的检查点出发，按小段重新算出来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">检查点：只把一部分中间值留下</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">只留少数节点，其余用时再算</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">保留下来的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">课件的说法是着色节点</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">重新算出来的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">从最近的检查点按小段重算</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是显存降下来，计算量升上去</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是一次明确的交换</text>
</svg>
