<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-4-title fig-memory-optimization-4-desc">
  <title id="fig-memory-optimization-4-title">隔几层放一个检查点，是一个可调的数</title>
  <desc id="fig-memory-optimization-4-desc">课件给的分析是：N 层的网络里每隔 k 层放一个检查点，前向与反向各自的开销就与这个 k 有关；k 越小，留下的检查点越多、重算越少。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">隔几层放一个检查点，是一个可调的数</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">每隔 k 层放一个检查点</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">k 取小</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">检查点多，重算少，显存高</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">k 取大</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">检查点少，重算多，显存低</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">所以 k 是一个要按显存余量来定的数</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它和前面几讲的分块尺寸是同一类旋钮</text>
</svg>
