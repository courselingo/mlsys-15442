<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-11-title fig-memory-optimization-11-desc">
  <title id="fig-memory-optimization-11-title">完全分片的数据并行：参数按卡切开</title>
  <desc id="fig-memory-optimization-11-desc">核心做法是把权重分片放在不同的 GPU 上；每块卡只留一部分权重，用到的时候再凑齐。课件的说法是它的核心想法与 ZeRO 第三阶段等价。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">完全分片的数据并行：参数按卡切开</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">FSDP：权重分片放在不同 GPU 上</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每块卡只留一部分权重</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">等价于</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">ZeRO 的第三阶段</text>
  <rect x="25" y="234" width="680" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="365.0" y="263.7" font-size="15" fill="#166534" text-anchor="middle">于是单卡显存不再需要放下整个模型</text>
  <text x="365.0" y="281.7" font-size="12" fill="#166534" text-anchor="middle">第 9 讲那道墙在这里被绕开</text>
</svg>
