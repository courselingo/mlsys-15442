<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 334.0" width="758" height="334.0"
     role="img" aria-labelledby="fig-memory-optimization-5-title fig-memory-optimization-5-desc">
  <title id="fig-memory-optimization-5-title">16 位浮点有两种格式，取舍不同</title>
  <desc id="fig-memory-optimization-5-desc">课件把 float16 与 bfloat16 摆在一起比：一种有更多的小数位，另一种阶码更长、不容易溢出。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="334.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">16 位浮点有两种格式，取舍不同</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同样是 16 位，两种分法</text>
  <rect x="25" y="138" width="340" height="90" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="169.7" font-size="15" fill="#1e40af" text-anchor="middle">float16</text>
  <text x="195.0" y="187.7" font-size="12" fill="#1e40af" text-anchor="middle">小数位更多</text>
  <text x="195.0" y="205.7" font-size="12" fill="#1e40af" text-anchor="middle">精度高，但更容易溢出</text>
  <rect x="393" y="138" width="340" height="90" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="169.7" font-size="15" fill="#166534" text-anchor="middle">bfloat16</text>
  <text x="563.0" y="187.7" font-size="12" fill="#166534" text-anchor="middle">阶码更长</text>
  <text x="563.0" y="205.7" font-size="12" fill="#166534" text-anchor="middle">不容易溢出，精度低一些</text>
  <rect x="25" y="256" width="712" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="381.0" y="285.7" font-size="15" fill="#6b21a8" text-anchor="middle">选哪一种，取决于你的数值范围会不会撑破</text>
  <text x="381.0" y="303.7" font-size="12" fill="#6b21a8" text-anchor="middle">第 8 讲那个 65504 的上界，就是 float16 的问题</text>
</svg>
