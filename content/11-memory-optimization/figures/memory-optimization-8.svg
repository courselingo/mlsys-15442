<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 782 312.0" width="782" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-8-title fig-memory-optimization-8-desc">
  <title id="fig-memory-optimization-8-title">reduce_scatter：一圈走完，每人负责一片</title>
  <desc id="fig-memory-optimization-8-desc">沿着环做流式聚合，每台设备把收到的片段加起来再传给下一个；走完 N−1 轮之后，每台设备手上恰好有一片已经聚合好的完整结果。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="782" height="312.0" fill="#ffffff"/>

  <text x="393.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">reduce_scatter：一圈走完，每人负责一片</text>
  <rect x="25" y="70" width="700" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="375.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">reduce_scatter：走完一圈，每人有一段是对的</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">收到的片段相加，再传给下一个</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">结果</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">每人负责的那一片是完整的</text>
  <rect x="25" y="234" width="736" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="393.0" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">注意这时候每个人手里的结果还不一样</text>
  <text x="393.0" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">所以还需要后半场把各片发出去</text>
</svg>
