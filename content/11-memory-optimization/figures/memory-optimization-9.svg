<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 762 312.0" width="762" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-9-title fig-memory-optimization-9-desc">
  <title id="fig-memory-optimization-9-title">allgather：把自己那一片发给所有人</title>
  <desc id="fig-memory-optimization-9-desc">后半场沿同一个环继续走 N−1 轮，每台设备把自己负责的那一片传出去，走完之后所有设备都拿到了完整结果。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="762" height="312.0" fill="#ffffff"/>

  <text x="383.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">allgather：把自己那一片发给所有人</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">allgather：把各片凑齐</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">沿环把各自那一片传一圈</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">结果</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">每台设备都有了完整结果</text>
  <rect x="25" y="234" width="716" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件在这里问了一句：这个过程的复杂度是多少</text>
  <text x="383.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一步走 N−1 轮，每轮一片 M/N，每台设备收发约 M</text>
</svg>
