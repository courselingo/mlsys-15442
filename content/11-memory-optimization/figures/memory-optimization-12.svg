<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-12-title fig-memory-optimization-12-desc">
  <title id="fig-memory-optimization-12-title">用到哪一层，就把那一层凑齐</title>
  <desc id="fig-memory-optimization-12-desc">前向时先 allgather 出完整的权重，算完这一层就把完整副本丢掉；反向时再做一次 allgather，算完梯度后再把梯度分片归约回去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">用到哪一层，就把那一层凑齐</text>
  <rect x="25" y="70" width="690" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="370.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">前向与反向各凑齐一次，用完就丢</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">前向</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">allgather 出完整权重，算完丢掉</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">反向</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">再凑一次，算完把梯度归约回去</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是通信量上去了，显存降下来了</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这正是第 9 讲 ZeRO 第三阶段的那笔账</text>
</svg>
