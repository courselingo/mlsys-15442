<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-memory-optimization-7-title fig-memory-optimization-7-desc">
  <title id="fig-memory-optimization-7-title">环形归约其实是两件事拼起来的</title>
  <desc id="fig-memory-optimization-7-desc">课件把 AllReduce 拆成两个可以单独调用的接口：先做 reduce_scatter，再做 allgather；理解这两个半场，才能理解最后的分片并行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">环形归约其实是两件事拼起来的</text>
  <rect x="25" y="70" width="690" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="370.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">AllReduce = reduce_scatter + allgather</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">前半 reduce_scatter</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">每台设备拿到一片的完整结果</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">后半 allgather</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">把各片凑齐成完整结果</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两个半场在环形上各走 N−1 轮</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是上一讲那个 2M 的另一种数法</text>
</svg>
