<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 732 216.0" width="732" height="216.0"
     role="img" aria-labelledby="fig-why-ml-systems-4-title fig-why-ml-systems-4-desc">
  <title id="fig-why-ml-systems-4-title">三根支柱：ML 研究、数据、算力</title>
  <desc id="fig-why-ml-systems-4-desc">课件把 ML 应用拆成研究、数据、算力三根支柱；AlexNet 的方法在 2012 年前就有，真正变新的是数据和算力。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="732" height="216.0" fill="#ffffff"/>

  <text x="368.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三根支柱：ML 研究、数据、算力</text>
  <rect x="25" y="70" width="210" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="130.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">ML 研究</text>
  <rect x="263" y="70" width="210" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="368.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">数据</text>
  <rect x="501" y="70" width="210" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="606.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">算力</text>
  <rect x="25" y="138" width="210" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">新算法与新结构</text>
  <text x="130.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">ResNet、Transformer 从这里来</text>
  <rect x="263" y="138" width="210" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="368.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">数据即燃料</text>
  <text x="368.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">MTurk 让标注变便宜</text>
  <rect x="501" y="138" width="210" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="606.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">算力曲线抬头</text>
  <text x="606.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">Tensor Core 与公有云</text>
  <path d="M130,117 L130,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M368,117 L368,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M606,117 L606,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
