<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -1.0 612 311.0" width="612" height="311.0"
     role="img" aria-labelledby="fig-why-ml-systems-6-title fig-why-ml-systems-6-desc">
  <title id="fig-why-ml-systems-6-title">手写内核的代价：三件事被绑在一起</title>
  <desc id="fig-why-ml-systems-6-desc">模型结构、内核实现、硬件调优必须同时对上；任何一个改了，另外两个都要重做，所以换一个结构就要重来一遍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="-1.0" width="612" height="311.0" fill="#ffffff"/>

  <text x="308.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">手写内核的代价：三件事被绑在一起</text>
  <rect x="25" y="56" width="566" height="39" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="308.0" y="80.0" font-size="13" fill="#1e40af" text-anchor="middle">手写内核的代价：三件事必须同时对上</text>
  <rect x="25" y="123" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="152.7" font-size="15" fill="#1e40af" text-anchor="middle">模型结构</text>
  <text x="110.0" y="170.7" font-size="12" fill="#1e40af" text-anchor="middle">层数与算子</text>
  <rect x="223" y="123" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="308.0" y="152.7" font-size="15" fill="#1e40af" text-anchor="middle">内核实现</text>
  <text x="308.0" y="170.7" font-size="12" fill="#1e40af" text-anchor="middle">手写的 CUDA</text>
  <rect x="421" y="123" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="506.0" y="152.7" font-size="15" fill="#1e40af" text-anchor="middle">硬件调优</text>
  <text x="506.0" y="170.7" font-size="12" fill="#1e40af" text-anchor="middle">寄存器与共享内存</text>
  <path d="M200,152 L212,152" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M218,158 L206,158" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M398,152 L410,152" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M416,158 L404,158" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="219" width="566" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="308.0" y="248.7" font-size="15" fill="#9d174d" text-anchor="middle">任一个变了，另外两个都要重做</text>
  <text x="308.0" y="266.7" font-size="12" fill="#9d174d" text-anchor="middle">于是每换一个模型结构，六个星期就重来一次</text>
</svg>
