<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 762 221.0" width="762" height="221.0"
     role="img" aria-labelledby="fig-why-ml-systems-5-title fig-why-ml-systems-5-desc">
  <title id="fig-why-ml-systems-5-title">AlexNet 的三栏配料：方法、数据、算力</title>
  <desc id="fig-why-ml-systems-5-desc">2012 年 Krizhevsky 等人的方案里，方法是 SGD 与 Dropout 这类现成技术，数据是 100 万张标注图像，算力是两块 GTX 580 训练六天。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="762" height="221.0" fill="#ffffff"/>

  <text x="383.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">AlexNet 的三栏配料：方法、数据、算力</text>
  <rect x="25" y="70" width="220" height="45" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="135.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">方法</text>
  <rect x="273" y="70" width="220" height="45" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="383.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">数据</text>
  <rect x="521" y="70" width="220" height="45" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="631.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">算力</text>
  <rect x="25" y="143" width="220" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135.0" y="172.7" font-size="15" fill="#1e40af" text-anchor="middle">SGD、Dropout</text>
  <text x="135.0" y="190.7" font-size="12" fill="#1e40af" text-anchor="middle">卷积与初始化</text>
  <rect x="273" y="143" width="220" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="383.0" y="172.7" font-size="15" fill="#b45309" text-anchor="middle">ImageNet</text>
  <text x="383.0" y="190.7" font-size="12" fill="#b45309" text-anchor="middle">100 万张图像</text>
  <rect x="521" y="143" width="220" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="631.0" y="172.7" font-size="15" fill="#9d174d" text-anchor="middle">GTX 580 × 2</text>
  <text x="631.0" y="190.7" font-size="12" fill="#9d174d" text-anchor="middle">训练六天</text>
