<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 227.5" width="758" height="227.5"
     role="img" aria-labelledby="fig-why-ml-systems-2-title fig-why-ml-systems-2-desc">
  <title id="fig-why-ml-systems-2-title">今天在用的算法，大多在 2000 年之前就发明了</title>
  <desc id="fig-why-ml-systems-2-desc">1958 感知机、1986 反向传播、1992 支持向量机、1998 卷积网络、1999 梯度提升树，五个节点都在 2000 年以前。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="227.5" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">今天在用的算法，大多在 2000 年之前就发明了</text>
  <rect x="25" y="70" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="85.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">1958</text>
  <text x="85.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">感知机</text>
  <rect x="173" y="70" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="233.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">1986</text>
  <text x="233.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">反向传播</text>
  <rect x="321" y="70" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="381.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">1992</text>
  <text x="381.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">支持向量机</text>
  <rect x="469" y="70" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="529.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">1998</text>
  <text x="529.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">卷积网络</text>
  <rect x="617" y="70" width="120" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="677.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">1999</text>
  <text x="677.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">梯度提升树</text>
  <rect x="25" y="166" width="712" height="39" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="381.0" y="190.1" font-size="13" fill="#6b21a8" text-anchor="middle">今天在用的很多算法，在 2000 年之前就已经被发明出来了</text>
  <text x="381" y="215" font-size="10" fill="#94a3b8" text-anchor="middle">（年份与事件取自课件时间轴）</text>
</svg>
