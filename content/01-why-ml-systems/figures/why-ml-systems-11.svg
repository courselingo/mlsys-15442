  <rect x="25" y="70" width="160" height="39" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="105.0" y="94.0" font-size="13" fill="#1e40af" text-anchor="middle">课堂讲座</text>
  <rect x="213" y="70" width="160" height="39" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="293.0" y="94.0" font-size="13" fill="#1e40af" text-anchor="middle">个人编程作业</text>
  <rect x="401" y="70" width="160" height="39" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="481.0" y="94.0" font-size="13" fill="#1e40af" text-anchor="middle">小组期末项目</text>
  <rect x="589" y="70" width="160" height="39" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="669.0" y="94.0" font-size="13" fill="#1e40af" text-anchor="middle">Piazza 讨论</text>
