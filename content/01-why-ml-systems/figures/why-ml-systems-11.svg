  <title id="fig-why-ml-systems-11-title">这门课的四个组成部分</title>
  <desc id="fig-why-ml-systems-11-desc">课堂讲座、个人编程作业、小组期末项目与 Piazza 讨论四块组成；评分里作业与项目各占 45%，课堂参与占 10%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="770" height="215.0" fill="#ffffff"/>

