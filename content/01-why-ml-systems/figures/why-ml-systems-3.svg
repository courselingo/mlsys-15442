<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -1.0 768 298.0" width="768" height="298.0"
     role="img" aria-labelledby="fig-why-ml-systems-3-title fig-why-ml-systems-3-desc">
  <title id="fig-why-ml-systems-3-title">课件把 2000 年之后标成两段，而这两段是重叠的</title>
  <desc id="fig-why-ml-systems-3-desc">三个标签并排画在同一层，没有先后箭头也没有阶梯；因为「2000 到 2010 数据」与「2006 至今 算力」在 2006 到 2010 年间同时成立，它们是并列的，不是接续的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="-1.0" width="768" height="298.0" fill="#ffffff"/>

  <text x="386.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">课件把 2000 年之后标成两段，而这两段是重叠的</text>
  <rect x="25" y="56" width="722" height="122" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="38" y="73.85" font-size="11" fill="#64748b">课件给的三个并列标签</text>
  <rect x="40" y="95" width="212" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="146.0" y="124.7" font-size="15" fill="#1e40af" text-anchor="middle">1958–2000 研究期</text>
  <text x="146.0" y="142.7" font-size="12" fill="#1e40af" text-anchor="middle">算法基本齐了</text>
  <rect x="280" y="95" width="212" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="386.0" y="124.7" font-size="15" fill="#b45309" text-anchor="middle">2000–2010 数据期</text>
  <text x="386.0" y="142.7" font-size="12" fill="#b45309" text-anchor="middle">数据成了燃料</text>
  <rect x="520" y="95" width="212" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="626.0" y="124.7" font-size="15" fill="#9d174d" text-anchor="middle">2006 至今 算力期</text>
  <text x="626.0" y="142.7" font-size="12" fill="#9d174d" text-anchor="middle">算力曲线抬头</text>
  <rect x="25" y="206" width="722" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="386.0" y="235.7" font-size="15" fill="#6b21a8" text-anchor="middle">后两段在 2006 到 2010 年间是重叠的</text>
  <text x="386.0" y="253.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以它们是并列的标签，不是三个先后相接的阶段</text>
</svg>
