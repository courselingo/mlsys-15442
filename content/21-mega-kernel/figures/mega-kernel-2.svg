<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 790 244.0" width="790" height="244.0"
     role="img" aria-labelledby="fig-mega-kernel-2-title fig-mega-kernel-2-desc">
  <title id="fig-mega-kernel-2-title">现状：一个算子一个内核</title>
  <desc id="fig-mega-kernel-2-desc">课件画出常见的做法：矩阵乘、注意力、又一个矩阵乘、归约，每一个都是一个独立启动的内核，按顺序排下去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="790" height="244.0" fill="#ffffff"/>

  <text x="397.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">现状：一个算子一个内核</text>
  <rect x="25" y="70" width="165" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="107.5" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">矩阵乘</text>
  <text x="107.5" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一个内核</text>
  <rect x="218" y="70" width="165" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="300.5" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">注意力</text>
  <text x="300.5" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一个内核</text>
  <rect x="411" y="70" width="165" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="493.5" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">矩阵乘</text>
  <text x="493.5" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一个内核</text>
  <rect x="604" y="70" width="165" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="686.5" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">归约</text>
  <text x="686.5" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一个内核</text>
  <rect x="25" y="166" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">每个内核单独启动，之间靠内核边界隔开</text>
  <text x="380.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">这个做法很好懂，也很通用</text>
</svg>
