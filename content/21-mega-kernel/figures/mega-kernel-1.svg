<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-1-title fig-mega-kernel-1-desc">
  <title id="fig-mega-kernel-1-title">什么是（Mega-）Kernel</title>
  <desc id="fig-mega-kernel-1-desc">课件先回顾内核的基本单位：一个内核分成若干线程块，块里是线程，大家共同操作设备内存。而「Mega」指的是把这些内核合并成一个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">什么是（Mega-）Kernel</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">从「很多个小内核」到「一个巨大的内核」</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">原来的单位</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">一个内核分块、块分线程</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">Mega 的意思</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">把这些内核合成一个</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一讲要回答的是：合成一个之后，好处在哪、难处在哪</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">以及怎么把它自动做出来</text>
</svg>
