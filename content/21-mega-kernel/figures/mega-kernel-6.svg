<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-6-title fig-mega-kernel-6-desc">
  <title id="fig-mega-kernel-6-title">MPK：把大模型服务编译成一个 Mega-Kernel</title>
  <desc id="fig-mega-kernel-6-desc">课件给的系统叫 Mirage Persistent Kernel。它的两个卖点是工程量低（几十行 Python 就能把一个模型 mega 化）与性能更好。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">MPK：把大模型服务编译成一个 Mega-Kernel</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">MPK：Mirage Persistent Kernel</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">卖点一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">几十行 Python 就能做到</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">卖点二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">性能比现有系统更好</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第 20 讲的 Mirage 是搜内核，这一讲的 MPK 是搜整个任务的编排</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">两者共用「把困难交给搜索与验证」这个思路</text>
</svg>
