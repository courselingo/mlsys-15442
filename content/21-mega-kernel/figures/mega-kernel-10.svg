<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-10-title fig-mega-kernel-10-desc">
  <title id="fig-mega-kernel-10-title">编译流程第一步：算子分解与依赖分析</title>
  <desc id="fig-mega-kernel-10-desc">课件的第一步是按可用的 SM 数量来优化「算子到任务」的切法，并插入同步事件来准确刻画任务之间的依赖。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">编译流程第一步：算子分解与依赖分析</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">第一步：把算子切成任务，并标出依赖</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">切法由什么决定</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">可用的 SM 数量</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">依赖怎么记</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">插入同步事件</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一步的产物是那张任务图的初稿</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">后面四步都是在把它化简</text>
</svg>
