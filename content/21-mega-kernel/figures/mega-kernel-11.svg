<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 244.0" width="846" height="244.0"
     role="img" aria-labelledby="fig-mega-kernel-11-title fig-mega-kernel-11-desc">
  <title id="fig-mega-kernel-11-title">第二步与第三步：两种事件融合</title>
  <desc id="fig-mega-kernel-11-desc">课件的第二、三步都是在合并事件：后继集合相同的事件可以合并；输入依赖相同的事件也可以合并。两条规则的方向正好相对。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="244.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第二步与第三步：两种事件融合</text>
  <rect x="25" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">后继集融合</text>
  <text x="195.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">消费者相同的事件合一</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">前驱集融合</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">输入依赖相同的事件合一</text>
  <rect x="25" y="166" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">两条规则问的是同一个问题的两面</text>
  <text x="425.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">「谁在等我」和「我在等谁」</text>
</svg>
