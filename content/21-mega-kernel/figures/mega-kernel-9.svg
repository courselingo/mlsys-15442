<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-9-title fig-mega-kernel-9-desc">
  <title id="fig-mega-kernel-9-title">任务图与 CUDA 图的关系</title>
  <desc id="fig-mega-kernel-9-desc">课件说任务图是一种「更低层」的 CUDA 图：它能刻画子内核之间的依赖，而且是静态、不可变的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">任务图与 CUDA 图的关系</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">任务图是更低层的 CUDA 图</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">多了什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">子内核之间的依赖</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">保持了什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">静态、不可变</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">静态这一点既有好处也有代价</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">好在运行期不用重新分析；代价是动态的部分要另想办法</text>
</svg>
