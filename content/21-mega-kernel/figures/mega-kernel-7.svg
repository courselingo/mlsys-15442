<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 244.0" width="806" height="244.0"
     role="img" aria-labelledby="fig-mega-kernel-7-title fig-mega-kernel-7-desc">
  <title id="fig-mega-kernel-7-title">MPK 的总览：编译期与运行期各一半</title>
  <desc id="fig-mega-kernel-7-desc">课件的总览分成两侧：编译期把模型与服务配置变成一张任务图；运行期按这张图把任务分给各个 worker 执行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="244.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">MPK 的总览：编译期与运行期各一半</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">编译期</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">模型加服务配置 → 任务图</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">运行期</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">按任务图执行与同步</text>
  <rect x="25" y="166" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">两侧的接口就是那张任务图</text>
  <text x="405.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件的服务配置里包括批处理、分页、投机解码等</text>
</svg>
