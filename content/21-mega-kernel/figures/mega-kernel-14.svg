<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-14-title fig-mega-kernel-14-desc">
  <title id="fig-mega-kernel-14-title">收益与还没解决的问题</title>
  <desc id="fig-mega-kernel-14-desc">课件给的收益是把某个模型每个 token 的延迟从 14.5 毫秒降到 12.5 毫秒，而理论下界是 10 毫秒；它还列了两个未解的问题。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">收益与还没解决的问题</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">先把延迟推到硬件的极限附近</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">收益</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">每 token 14.5 毫秒 → 12.5 毫秒，下界 10 毫秒</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">还没解决</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">怎么把层切成任务、怎么跨 worker 调度</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件说它目前依赖启发式加性能剖析</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">调度器也只根据本地信息做决定，不与其他 worker 同步</text>
</svg>
