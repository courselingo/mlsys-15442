<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 244.0" width="776" height="244.0"
     role="img" aria-labelledby="fig-mega-kernel-4-title fig-mega-kernel-4-desc">
  <title id="fig-mega-kernel-4-title">两种做法的对比</title>
  <desc id="fig-mega-kernel-4-desc">课件的对比很直接：一个算子一个内核时，内核之间有一道屏障；而 Mega-Kernel 里没有内核屏障，整个模型在一次启动里跑完。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="244.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种做法的对比</text>
  <rect x="25" y="70" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">一个算子一个内核</text>
  <text x="195.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">每个之间有一道屏障</text>
  <rect x="393" y="70" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">Mega-Kernel</text>
  <text x="563.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">没有内核屏障</text>
  <rect x="25" y="166" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件把「没有内核屏障」放在 Mega-Kernel 这一栏</text>
  <text x="390.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">它不是一句描述，而是这一讲全部好处的来源</text>
</svg>
