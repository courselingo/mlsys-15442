<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-3-title fig-mega-kernel-3-desc">
  <title id="fig-mega-kernel-3-title">课件列了三点，前两点的成因不同</title>
  <desc id="fig-mega-kernel-3-desc">课件在 Limitations 那一页列了三点：一是没有跨层流水（成因是内核之间的屏障挡住了跨层流水）；二是没有重叠（成因是粗粒度的依赖挡住了计算与通信的重叠）；三是动态性受限（因为要靠 CUDA 图来降低内核启动开销）。本图讲的是前两点，而它们的成因是分开写的、不是同一条。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">课件列了三点，前两点的成因不同</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">Limitations 那一页列了三点</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">一 没有跨层流水</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">成因：内核之间的屏障</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">二 没有重叠</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">成因：粗粒度的依赖（不是屏障）</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">还有第三点：动态性受限（要靠 CUDA 图降启动开销）</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">气泡的意思是硬件在等，而不是在算</text>
</svg>
