<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-mega-kernel-3-title fig-mega-kernel-3-desc">
  <title id="fig-mega-kernel-3-title">两个限制都来自内核边界</title>
  <desc id="fig-mega-kernel-3-desc">课件指出两点：内核之间的屏障让跨层的流水线做不起来；同时也让细粒度的重叠做不起来。两个限制的根源是同一个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个限制都来自内核边界</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">内核边界挡住了两件事</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">限制一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">无法跨层流水，中间出现气泡</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">限制二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">无法做细粒度的重叠</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的图画了流水线里的气泡</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">气泡的意思是硬件在等，而不是在算</text>
</svg>
