<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-4-title fig-ml-compiler-gemm-4-desc">
  <title id="fig-ml-compiler-gemm-4-title">那个公式：列号与行号做一次异或</title>
  <desc id="fig-ml-compiler-gemm-4-desc">课件把 remapping 写成一行：swizzled_col 等于 logical_col 异或 row。异或的好处是它可逆，而且不同行算出来的结果必然落在不同扇区。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">那个公式：列号与行号做一次异或</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">swizzled_col = logical_col XOR row</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">为什么用异或</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">同一列的不同行会被打散</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">为什么可逆</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">异或两次就还原</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">可逆意味着不需要额外的存储来记录映射</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是它能做成硬件组合逻辑的前提</text>
</svg>
