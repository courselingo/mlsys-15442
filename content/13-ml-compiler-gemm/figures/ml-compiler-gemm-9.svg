<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-9-title fig-ml-compiler-gemm-9-desc">
  <title id="fig-ml-compiler-gemm-9-title">3D TMA：把分块也一起做了</title>
  <desc id="fig-ml-compiler-gemm-9-desc">课件给的下一步是用三维 TMA 直接搬进已经分块好的共享内存；全局内存那边是一块 16 乘 256 的 fp16，行是连续的 512 字节。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">3D TMA：把分块也一起做了</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">用三维 TMA 直接搬进分块加 swizzle 的共享内存</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">源</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">16×256 的 fp16，每行 512 字节连续</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">目的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">已经分块并 swizzle 好的共享内存</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">分块与重排都由硬件一次完成</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是把第 12 讲的布局记号落成硬件指令的方式</text>
</svg>
