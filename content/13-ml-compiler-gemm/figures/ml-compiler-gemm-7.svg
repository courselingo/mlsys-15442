<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-7-title fig-ml-compiler-gemm-7-desc">
  <title id="fig-ml-compiler-gemm-7-title">张量核心为什么要 swizzle</title>
  <desc id="fig-ml-compiler-gemm-7-desc">课件给的理由很具体：张量核心从共享内存里读的是一个 M 乘 16 的小块，它正好需要 8 乘 8 的无冲突读取，而这正是 swizzle 能保证的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">张量核心为什么要 swizzle</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">张量核心读 M×16，正好需要 8×8 无冲突</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">它读什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">共享内存里 M 乘 16 的一块</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">它需要什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">一次无冲突的 8 乘 8 读取</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是 swizzle 与张量核心天然对得上</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">8 乘 8 就是 8 个 16 字节的格，swizzle 之后正好无冲突</text>
</svg>
