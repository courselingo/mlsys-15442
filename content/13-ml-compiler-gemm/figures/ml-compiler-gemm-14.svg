<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 244.0" width="876" height="244.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-14-title fig-ml-compiler-gemm-14-desc">
  <title id="fig-ml-compiler-gemm-14-title">这一讲把第 12 讲的记号落成了硬件动作</title>
  <desc id="fig-ml-compiler-gemm-14-desc">第 12 讲讲了布局的记号，这一讲把记号里的每一项对应到真实硬件：swizzle 对应地址重映射，张量核心对应计算单元，TMA 对应数据搬运。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="244.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲把第 12 讲的记号落成了硬件动作</text>
  <rect x="25" y="70" width="210" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="130.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">第 12 讲</text>
  <text x="130.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">布局怎么描述</text>
  <rect x="263" y="70" width="210" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="368.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">第 13 讲</text>
  <text x="368.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">布局怎么落地</text>
  <rect x="501" y="70" width="210" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="606.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">后面几讲</text>
  <text x="606.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">换一种硬件再走一遍</text>
  <rect x="25" y="166" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">同一套记号，不同的硬件兑现方式</text>
  <text x="440.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">这也是把布局抽象出来的价值</text>
</svg>
