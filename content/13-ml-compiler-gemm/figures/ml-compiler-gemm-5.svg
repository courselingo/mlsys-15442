<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-5-title fig-ml-compiler-gemm-5-desc">
  <title id="fig-ml-compiler-gemm-5-title">反过来：swizzle 给分块加了约束</title>
  <desc id="fig-ml-compiler-gemm-5-desc">既然地址要被重映射，那么分块就不能随便切。课件把它讲成一条约束：你选的分块尺寸必须能被 swizzle 原子整除，否则重映射会跨出块外。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">反过来：swizzle 给分块加了约束</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">swizzle 不是免费的：它约束了分块</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">约束是什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">分块要能被 swizzle 原子整除</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">为什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">否则重映射会跨出块外</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条约束在后面会一路影响下去</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">连 TMA 的配置方式都由它决定</text>
</svg>
