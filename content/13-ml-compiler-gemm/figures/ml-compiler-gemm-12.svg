<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-12-title fig-ml-compiler-gemm-12-desc">
  <title id="fig-ml-compiler-gemm-12-title">端到端的数据通路</title>
  <desc id="fig-ml-compiler-gemm-12-desc">课件最后给了一条完整通路：TMA 把全局内存里的分块搬进共享内存，张量核心从共享内存里读数并做乘加，结果写进 C。中间 B 的搬运被省略了，因为它的路径是一样的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">端到端的数据通路</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">端到端：TMA 搬、张量核心算</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">搬的那一段</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">A 从全局内存进共享内存，B 同理</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">算的那一段</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">张量核心读共享内存里的两块相乘</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件还标出了两重循环</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">外层是 N 方向的分块，内层是 K 方向的分块</text>
</svg>
