<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-10-title fig-ml-compiler-gemm-10-desc">
  <title id="fig-ml-compiler-gemm-10-title">为什么偏好 128B：两边各退一步的结果</title>
  <desc id="fig-ml-compiler-gemm-10-desc">课件从两侧各给了一条理由：张量核心那一侧，任何 swizzle 格式都行；全局内存那一侧，行越宽搬得越少越大，带宽越好。128B 是这两条线的交点。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么偏好 128B：两边各退一步的结果</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">为什么默认选 SWIZZLE_128B</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">张量核心那侧</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">任何格式都行，16×16 可拆成任意原子</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">全局内存那侧</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">原子每行连续，行越宽搬得越划算</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">128B 给出每行 128 字节连续</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件说除非分块宽度小于 64 个 fp16，否则它就是最好的默认</text>
</svg>
