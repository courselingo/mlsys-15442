<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-8-title fig-ml-compiler-gemm-8-desc">
  <title id="fig-ml-compiler-gemm-8-title">TMA：一条指令搬一整块</title>
  <desc id="fig-ml-compiler-gemm-8-desc">课件说 TMA 是带可选 swizzle 的硬件二维拷贝，一条指令就能完成，不需要线程参与；它把全局内存里 16 乘 128 的 fp16 直接搬成共享内存里 8 乘 8 的扇区布局。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">TMA：一条指令搬一整块</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">TMA = 硬件二维拷贝 + 可选 swizzle，一条指令</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它省掉了什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">不再需要一堆线程去搬数据</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它顺带做了什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">搬运的同时按模式重排地址</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的例子是 16×128 的 fp16，每格 16 字节</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">搬进共享内存后就是已经 swizzle 好的 8×8 扇区</text>
</svg>
