<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-6-title fig-ml-compiler-gemm-6-desc">
  <title id="fig-ml-compiler-gemm-6-title">张量核心的形状：四个可选项加一个固定值</title>
  <desc id="fig-ml-compiler-gemm-6-desc">课件给的参数表是：M 与 N 各可以是 16、32、64、128，K 固定是 16，另外还有是否转置 A 与是否转置 B 两个开关。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">张量核心的形状：四个可选项加一个固定值</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">张量核心一次计算的形状</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">可选的 M 与 N</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">16、32、64、128</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">固定的 K 与两个开关</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">K 是 16，另有转置 A、转置 B</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">K 固定为 16 这一点很关键</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它决定了共享内存里一次要摆多少列</text>
</svg>
