<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-gemm-2-title fig-ml-compiler-gemm-2-desc">
  <title id="fig-ml-compiler-gemm-2-title">回顾：8×8 的 swizzle 是怎么做的</title>
  <desc id="fig-ml-compiler-gemm-2-desc">上一讲给过一个最简单的例子：8 乘 8 的方块里用 XOR 把列打散；这一讲先回顾它，再推到真实的 SWIZZLE_128B。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">回顾：8×8 的 swizzle 是怎么做的</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">回顾：最简单的 8×8 swizzle</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">对列号做一次异或</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">目的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">让同一列的多行落在不同 bank</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">上一讲讲过它的动机</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲要把它推到真实硬件的尺寸上</text>
</svg>
