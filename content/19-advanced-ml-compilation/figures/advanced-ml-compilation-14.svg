<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 314.0" width="876" height="314.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-14-title fig-advanced-ml-compilation-14-desc">
  <title id="fig-advanced-ml-compilation-14-title">从云端到一百美元的板子</title>
  <desc id="fig-advanced-ml-compilation-14-desc">课件最后用一组真实部署收尾：服务器上的 OpenAI 兼容服务、iOS 与安卓的 SDK、一百美元的开发板、掌机，以及直接在浏览器里跑的 WebLLM。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="314.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从云端到一百美元的板子</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一套编译栈铺到了这些地方</text>
  <rect x="25" y="140" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="169.7" font-size="15" fill="#1e40af" text-anchor="middle">服务器</text>
  <text x="110.0" y="187.7" font-size="12" fill="#1e40af" text-anchor="middle">兼容 OpenAI 接口</text>
  <rect x="223" y="140" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="308.0" y="169.7" font-size="15" fill="#1e40af" text-anchor="middle">手机</text>
  <text x="308.0" y="187.7" font-size="12" fill="#1e40af" text-anchor="middle">iOS 与安卓 SDK</text>
  <rect x="421" y="140" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="169.7" font-size="15" fill="#b45309" text-anchor="middle">开发板</text>
  <text x="506.0" y="187.7" font-size="12" fill="#b45309" text-anchor="middle">一百美元级</text>
  <rect x="619" y="140" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="704.0" y="169.7" font-size="15" fill="#166534" text-anchor="middle">浏览器</text>
  <text x="704.0" y="187.7" font-size="12" fill="#166534" text-anchor="middle">WebLLM 直接跑</text>
  <rect x="25" y="236" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="265.7" font-size="15" fill="#6b21a8" text-anchor="middle">还有一条在讲的是掌机，靠 Vulkan 后端开箱支持</text>
  <text x="440.0" y="283.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件的落点是：跨设备的代价被压到了可接受的程度</text>
</svg>
