<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-8-title fig-advanced-ml-compilation-8-desc">
  <title id="fig-advanced-ml-compilation-8-title">跨函数推导</title>
  <desc id="fig-advanced-ml-compilation-8-desc">课件的关键能力是：Relax 会在多个函数之间全局地追踪并推导符号形状，而不是只看单个函数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">跨函数推导</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">符号形状的推导是跨函数的</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">只看单个函数</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">形状推导会断链</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">全局追踪</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">调用关系上的符号能连起来</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一条决定了很多优化能不能做</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">形状推不出来，后面的分块与融合就没有依据</text>
</svg>
