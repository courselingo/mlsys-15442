<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-6-title fig-advanced-ml-compilation-6-desc">
  <title id="fig-advanced-ml-compilation-6-title">Relax 与 IRModule</title>
  <desc id="fig-advanced-ml-compilation-6-desc">课件把它的方案叫 Relax，定位是「为端到端动态机器学习提供的可组合抽象」；它的核心构造是一个叫 IRModule 的东西，里面装着若干函数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Relax 与 IRModule</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">Relax：围绕一个核心构造组织</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">这个构造</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">IRModule，装着若干函数</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">函数的写法</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">用装饰器标注张量运算</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给了一段最短的例子：一个矩阵乘函数</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它用类型标注写清输入形状与数据类型，形状里可以出现符号</text>
</svg>
