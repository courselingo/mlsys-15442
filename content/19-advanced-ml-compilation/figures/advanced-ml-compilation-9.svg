<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-9-title fig-advanced-ml-compilation-9-desc">
  <title id="fig-advanced-ml-compilation-9-title">跨层级追踪动态性</title>
  <desc id="fig-advanced-ml-compilation-9-desc">课件还讲了在多个层级上追踪动态性：从图级别的端到端动态模型，一直到运行时的具体取值；同一份程序在不同层级上表现出不同程度的「不确定」。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">跨层级追踪动态性</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">动态性要按层级分别追踪</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">图这一级</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">端到端的动态模型</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">运行这一级</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">具体取值到运行时才知道</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的例子是一个端到端动态的模型</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它要能同时容纳「编译期已知」与「运行时才知」两类信息</text>
</svg>
