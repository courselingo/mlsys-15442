<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 244.0" width="856" height="244.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-12-title fig-advanced-ml-compilation-12-desc">
  <title id="fig-advanced-ml-compilation-12-title">从推理引擎到智能体</title>
  <desc id="fig-advanced-ml-compilation-12-desc">课件把 LLM 系统的形态画了出来：上下文的准备、预填充、思考、动作调用、再思考、输出，共六个环节（中间用省略号表示会重复），一路串下去就是智能体的流程；而每一种环节对推理引擎的要求都不同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="244.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从推理引擎到智能体</text>
  <rect x="25" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">预填充</text>
  <text x="110.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">处理输入</text>
  <rect x="223" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">思考</text>
  <text x="308.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">生成推理过程</text>
  <rect x="421" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">动作调用</text>
  <text x="506.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">输出结构化指令</text>
  <rect x="619" y="70" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="704.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">输出</text>
  <text x="704.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">给出最终答案</text>
  <rect x="25" y="166" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的说法是 LLM 系统正在朝以智能体为中心演进</text>
  <text x="430.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">这条链里最特别的一环是「动作调用」，因为它要求结构化的输出</text>
</svg>
