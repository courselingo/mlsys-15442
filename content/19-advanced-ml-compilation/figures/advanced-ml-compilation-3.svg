<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-3-title fig-advanced-ml-compilation-3-desc">
  <title id="fig-advanced-ml-compilation-3-title">机器学习编译能帮上什么</title>
  <desc id="fig-advanced-ml-compilation-3-desc">课件给的答案是编译这一层：把模型与设备解耦，让同一份模型描述可以被翻译到不同的后端；它把模型与内存规划放在一起考虑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">机器学习编译能帮上什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">编译这一层负责把模型翻译到不同后端</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">它管什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">模型的描述与内存的规划</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">它不管什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">模型本身的算法</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">解耦是这里的关键词</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">模型描述一次，后端各自适配一次，而不是每个组合都适配一次</text>
</svg>
