<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-7-title fig-advanced-ml-compilation-7-desc">
  <title id="fig-advanced-ml-compilation-7-title">符号形状是一等公民</title>
  <desc id="fig-advanced-ml-compilation-7-desc">课件把「一等的符号形状」单独讲了好几页：形状里的某一维不再是一个具体数字，而是一个可以参与推导的符号，比如一个未知的批大小。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">符号形状是一等公民</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">形状里的一维可以是符号，而不是具体数字</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">好处是什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">同一份代码适配不同批大小</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">代价是什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">形状要在编译期推导出来</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的例子是一个形状为问号乘 2 乘 2 的张量</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">「问号」就是那个未知的批</text>
</svg>
