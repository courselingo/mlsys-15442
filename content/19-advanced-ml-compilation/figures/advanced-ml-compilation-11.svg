<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 430.0" width="846" height="430.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-11-title fig-advanced-ml-compilation-11-desc">
  <title id="fig-advanced-ml-compilation-11-title">三个 pass 的分工</title>
  <desc id="fig-advanced-ml-compilation-11-desc">课件把融合拆成三个 pass：先分析每个张量程序的计算模式，再决定哪些算子应该融合，最后把决定落实成实际的代码。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="430.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个 pass 的分工</text>
  <rect x="25" y="70" width="620" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="335.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">第一个 pass</text>
  <text x="335.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">分析张量程序的计算模式</text>
  <rect x="25" y="163" width="620" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="335.0" y="192.7" font-size="15" fill="#b45309" text-anchor="middle">第二个 pass</text>
  <text x="335.0" y="210.7" font-size="12" fill="#b45309" text-anchor="middle">决定哪些算子融合在一起</text>
  <rect x="25" y="256" width="620" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="335.0" y="285.7" font-size="15" fill="#166534" text-anchor="middle">第三个 pass</text>
  <text x="335.0" y="303.7" font-size="12" fill="#166534" text-anchor="middle">把融合的结论落实成代码</text>
  <rect x="25" y="352" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="381.7" font-size="15" fill="#6b21a8" text-anchor="middle">三步分开的意义在于可检查</text>
  <text x="425.0" y="399.7" font-size="12" fill="#6b21a8" text-anchor="middle">分析的结果可以被读出来看，而融合的决定可以被单独替换</text>
</svg>
