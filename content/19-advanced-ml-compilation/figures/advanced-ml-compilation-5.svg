<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-advanced-ml-compilation-5-title fig-advanced-ml-compilation-5-desc">
  <title id="fig-advanced-ml-compilation-5-title">LLM 时代，开发模式变了</title>
  <desc id="fig-advanced-ml-compilation-5-desc">课件对比了两种开发方式：一种是假设底层框架已经成熟、自己只做封闭的变换；另一种是直接为模型定制函数的组合。它认为后一种正在变多。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">LLM 时代，开发模式变了</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">两种开发方式</text>
  <rect x="25" y="138" width="340" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">旧的方式</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">假定框架成熟，只做局部变换</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">新的方式</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">直接为模型定制函数组合</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第二种方式的代价是重复劳动</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而编译这一层要做的，就是把这种定制变成可复用的</text>
</svg>
