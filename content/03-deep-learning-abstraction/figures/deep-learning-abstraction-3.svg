<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 732 317.0" width="732" height="317.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-3-title fig-deep-learning-abstraction-3-desc">
  <title id="fig-deep-learning-abstraction-3-title">深度学习改的是三栏里的第一栏</title>
  <desc id="fig-deep-learning-abstraction-3-desc">上面一行是机器学习的三个要素，第一栏被标成要改的那一栏；下面两条分别讲深度学习在这一栏里做了什么，以及另外两栏为什么可以照旧。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="732" height="317.0" fill="#ffffff"/>

  <text x="368.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">深度学习改的是三栏里的第一栏</text>
  <rect x="25" y="70" width="210" height="45" fill="#fce7f3" stroke="#ec4899"/>
  <text x="130.0" y="97.8" font-size="15" fill="#9d174d" text-anchor="middle">模型类</text>
  <rect x="263" y="70" width="210" height="45" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="368.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">损失函数</text>
  <rect x="501" y="70" width="210" height="45" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="606.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">训练方法</text>
  <rect x="25" y="143" width="686" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="368.0" y="172.7" font-size="15" fill="#b45309" text-anchor="middle">第一栏里加一条设定：多层组合</text>
  <text x="368.0" y="190.7" font-size="12" fill="#b45309" text-anchor="middle">把简单层叠起来，所有层的参数一起学，也就是端到端训练</text>
  <rect x="25" y="239" width="686" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="368.0" y="268.7" font-size="15" fill="#1e40af" text-anchor="middle">另外两栏照旧</text>
  <text x="368.0" y="286.7" font-size="12" fill="#1e40af" text-anchor="middle">损失函数与训练方法，和别的机器学习方法一样</text>
</svg>
