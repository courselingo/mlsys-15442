<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 257" width="754" height="257"
     role="img" aria-labelledby="fig-deep-learning-abstraction-12-title fig-deep-learning-abstraction-12-desc">
  <title id="fig-deep-learning-abstraction-12-title">计算图抽象：节点是计算，边是数据依赖</title>
  <desc id="fig-deep-learning-abstraction-12-desc">课件给的定义很短：节点代表计算，边代表算子之间的数据依赖。节点分两类：数据节点（输入 a、b）与计算节点（乘法、加法）。a 乘 b 再加 3 就是一张最小的计算图，箭头方向就是数据依赖的方向。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="257" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">计算图抽象：节点是计算，边是数据依赖</text>

  <rect x="25" y="83" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="112.7" font-size="15" fill="#1e40af" text-anchor="middle">节点 = 计算</text>
  <text x="195.0" y="130.7" font-size="12" fill="#1e40af" text-anchor="middle">分数据节点与计算节点</text>

  <rect x="393" y="83" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="112.7" font-size="15" fill="#b45309" text-anchor="middle">边 = 数据依赖</text>
  <text x="563.0" y="130.7" font-size="12" fill="#b45309" text-anchor="middle">谁的结果被谁用到</text>

  <rect x="25" y="179" width="156" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="103.0" y="208.7" font-size="15" fill="#1e40af" text-anchor="middle">数据节点</text>
  <text x="103.0" y="226.7" font-size="12" fill="#1e40af" text-anchor="middle">输入 a、b</text>

  <rect x="209" y="179" width="156" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="287.0" y="208.7" font-size="15" fill="#6b21a8" text-anchor="middle">计算节点</text>
  <text x="287.0" y="226.7" font-size="12" fill="#6b21a8" text-anchor="middle">乘法</text>

  <rect x="393" y="179" width="156" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="471.0" y="208.7" font-size="15" fill="#6b21a8" text-anchor="middle">计算节点</text>
  <text x="471.0" y="226.7" font-size="12" fill="#6b21a8" text-anchor="middle">加法 + 3</text>

  <rect x="577" y="179" width="156" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="655.0" y="208.7" font-size="15" fill="#166534" text-anchor="middle">结果</text>
  <text x="655.0" y="226.7" font-size="12" fill="#166534" text-anchor="middle">a * b + 3</text>

  <path d="M186,213 L198,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,213 L382,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M554,213 L566,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
