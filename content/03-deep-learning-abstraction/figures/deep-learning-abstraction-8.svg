  <text x="350.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">位置</text>
  <text x="350.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一次查询</text>
  <rect x="430" y="70" width="110" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="485.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">位置</text>
  <text x="485.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一次查询</text>
