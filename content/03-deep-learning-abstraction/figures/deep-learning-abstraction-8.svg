  <title id="fig-deep-learning-abstraction-8-title">注意力：把序列内部的并行打开</title>
  <desc id="fig-deep-learning-abstraction-8-desc">每个位置各自发出一次查询，去读取同一组 values；位置之间不再互相等待，不能并行的算子数不随序列长度增长。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="831" height="244.0" fill="#ffffff"/>

