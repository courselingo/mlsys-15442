  <text x="620.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">位置</text>
  <text x="620.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一次查询</text>
  <rect x="700" y="70" width="110" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="755.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">位置</text>
  <text x="755.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一次查询</text>
  <path d="M80,143 L80,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
