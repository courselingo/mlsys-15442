  <text x="80.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一次查询</text>
  <rect x="160" y="70" width="110" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="215.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">位置</text>
