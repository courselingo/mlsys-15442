<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 612 340.0" width="612" height="340.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-9-title fig-deep-learning-abstraction-9-desc">
  <title id="fig-deep-learning-abstraction-9-title">图神经网络：先聚合邻居，再更新自己</title>
  <desc id="fig-deep-learning-abstraction-9-desc">目标顶点的表示由邻居的表示聚合而来，聚合可以是求和、LSTM 等等；把图传播和神经网络算子合在一起，就是图神经网络。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="612" height="340.0" fill="#ffffff"/>

  <text x="308.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">图神经网络：先聚合邻居，再更新自己</text>
  <rect x="25" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">邻居 A</text>
  <text x="110.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">表示向量</text>
  <rect x="223" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="308.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">邻居 B</text>
  <text x="308.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">表示向量</text>
  <rect x="421" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="506.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">邻居 C</text>
  <text x="506.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">表示向量</text>
  <rect x="25" y="166" width="566" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="195.7" font-size="15" fill="#b45309" text-anchor="middle">邻居聚合</text>
  <text x="308.0" y="213.7" font-size="12" fill="#b45309" text-anchor="middle">求和、LSTM 等都可以，再由目标顶点收下</text>
  <rect x="223" y="262" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="308.0" y="291.7" font-size="15" fill="#166534" text-anchor="middle">目标顶点</text>
  <text x="308.0" y="309.7" font-size="12" fill="#166534" text-anchor="middle">新的表示</text>
  <path d="M110,143 L110,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M308,143 L308,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M506,143 L506,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M308,239 L308,251" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
