<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 734 244.0" width="734" height="244.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-1-title fig-deep-learning-abstraction-1-desc">
  <title id="fig-deep-learning-abstraction-1-title">这一讲分两半：先看模型，再看抽象</title>
  <desc id="fig-deep-learning-abstraction-1-desc">上半把今天要跑的五个模型家族过一遍，下半讲计算图这套抽象；两边之间是一条线，系统是被应用塑形的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="734" height="244.0" fill="#ffffff"/>

  <text x="369.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲分两半：先看模型，再看抽象</text>
  <rect x="25" y="70" width="330" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">上半：深度学习总览</text>
  <text x="190.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">今天要跑的东西长什么样</text>
  <rect x="383" y="70" width="330" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="548.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">下半：编程抽象</text>
  <text x="548.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">框架用什么表示接住它们</text>
  <rect x="25" y="166" width="688" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="369.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">两边之间是一条线</text>
  <text x="369.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">模型形态决定系统要解决什么问题</text>
</svg>
