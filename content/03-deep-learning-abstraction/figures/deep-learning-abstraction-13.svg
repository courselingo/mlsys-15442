<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 730 244.0" width="730" height="244.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-13-title fig-deep-learning-abstraction-13-desc">
  <title id="fig-deep-learning-abstraction-13-title">案例的前向部分：从输入与权重到预测</title>
  <desc id="fig-deep-learning-abstraction-13-desc">课件的例子先建出前向：输入 x 与权重 W 交给矩阵乘，结果过 softmax 得到预测 y；这一步只声明计算，还没有算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="730" height="244.0" fill="#ffffff"/>

  <text x="367.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">案例的前向部分：从输入与权重到预测</text>
  <rect x="25" y="70" width="150" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="100.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">x</text>
  <text x="100.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">输入</text>
  <rect x="203" y="70" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="278.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">matmul</text>
  <text x="278.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">矩阵乘</text>
  <rect x="381" y="70" width="150" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="456.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">softmax</text>
  <text x="456.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">归一化成概率</text>
  <rect x="559" y="70" width="150" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="634.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">y</text>
  <text x="634.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">预测</text>
  <path d="M180,104 L192,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M358,104 L370,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M536,104 L548,104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="203" y="166" width="150" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="278.0" y="195.7" font-size="15" fill="#b45309" text-anchor="middle">W</text>
  <text x="278.0" y="213.7" font-size="12" fill="#b45309" text-anchor="middle">权重矩阵</text>
  <path d="M278,161 L278,149" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
