  <rect x="649" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="713.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">MoE</text>
  <text x="713.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">多个专家</text>
  <path d="M89,117 L89,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M245,117 L245,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M401,117 L401,127" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
