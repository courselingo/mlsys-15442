<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 798 216.0" width="798" height="216.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-4-title fig-deep-learning-abstraction-4-desc">
  <title id="fig-deep-learning-abstraction-4-title">课件列出的五个模型家族</title>
  <desc id="fig-deep-learning-abstraction-4-desc">课件在这一节要把五个家族过一遍：卷积网络做视觉，循环网络做序列，Transformer 靠注意力，图神经网络处理关系数据，混合专家把模型拆成多个专家。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="798" height="216.0" fill="#ffffff"/>

  <text x="401.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">课件列出的五个模型家族</text>
  <rect x="25" y="70" width="752" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="401.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">课件的模型家族清单</text>
  <rect x="25" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="89.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">CNN</text>
  <text x="89.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">视觉</text>
  <rect x="181" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="245.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">RNN</text>
  <text x="245.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">序列</text>
  <rect x="337" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="401.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">Transformer</text>
  <text x="401.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">注意力</text>
  <rect x="493" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="557.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">GNN</text>
