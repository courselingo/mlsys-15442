<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 232.0" width="786" height="232.0"
     role="img" aria-labelledby="fig-deep-learning-abstraction-7-title fig-deep-learning-abstraction-7-desc">
  <title id="fig-deep-learning-abstraction-7-title">循环网络的代价：一步都不能提前算</title>
  <desc id="fig-deep-learning-abstraction-7-desc">状态 n 必须等状态 n−1 算完才能算，前向与反向都有正比于序列长度的不可并行算子，所以长序列很难训。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="232.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">循环网络的代价：一步都不能提前算</text>
  <rect x="25" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="75.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <rect x="153" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="203.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <rect x="281" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="331.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <rect x="409" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="459.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <rect x="537" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="587.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <rect x="665" y="70" width="100" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="715.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">第 n 步</text>
  <path d="M130,98 L142,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M258,98 L270,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M386,98 L398,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M514,98 L526,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M642,98 L654,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="154" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="183.7" font-size="15" fill="#6b21a8" text-anchor="middle">状态 n 必须等状态 n−1 算完</text>
  <text x="395.0" y="201.7" font-size="12" fill="#6b21a8" text-anchor="middle">前向与反向各有 O(序列长度) 个不能并行的算子</text>
</svg>
