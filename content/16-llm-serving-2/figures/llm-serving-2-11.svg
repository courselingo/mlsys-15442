<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-11-title fig-llm-serving-2-11-desc">
  <title id="fig-llm-serving-2-11-title">采样带来的困难</title>
  <desc id="fig-llm-serving-2-11-desc">课件指出一个挑战：要验证的是随机采样下的等价性。它用一页说明最朴素的采样做法可能是次优的，然后给出投机采样的做法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">采样带来的困难</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">难点在「随机」这两个字上</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">为什么难</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">要保证与原本的采样分布一致</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">朴素做法的问题</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">直接接受或拒绝，分布会偏</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的做法叫投机采样</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它用一次校正把接受与拒绝的规则调回来，使结果分布与原来完全一致</text>
</svg>
