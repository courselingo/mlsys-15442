<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-14-title fig-llm-serving-2-14-desc">
  <title id="fig-llm-serving-2-14-title">SSD：让验证不再空等</title>
  <desc id="fig-llm-serving-2-14-desc">课件指出一个具体问题：验证者必须空等投机者把草稿算出来。它的解法是让投机在一台独立设备上与验证并行，并且预先为多种可能的验证结果各算好一份草稿。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">SSD：让验证不再空等</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">问题：验证者要等投机者</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">解法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">投机放到另一台设备上并行做</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">关键手法</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">预先把多种验证结果对应的草稿都算好</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一讲最后留下的印象是：投机的瓶颈会转移</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">从「猜得准不准」转到「验证有没有白等」</text>
</svg>
