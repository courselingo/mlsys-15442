<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 244.0" width="866" height="244.0"
     role="img" aria-labelledby="fig-llm-serving-2-13-title fig-llm-serving-2-13-desc">
  <title id="fig-llm-serving-2-13-title">不基于模型的路线</title>
  <desc id="fig-llm-serving-2-13-desc">课件给了三条不依赖草稿模型的路线：从提示词里查（Prompt lookup）、用后缀树做两级投机（SuffixDecoding）、以及前瞻解码（Lookahead）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="244.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">不基于模型的路线</text>
  <rect x="25" y="70" width="210" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">查提示词</text>
  <text x="130.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">输入里有就直接抄</text>
  <rect x="263" y="70" width="210" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="368.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">后缀树</text>
  <text x="368.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">两级后缀树来投机</text>
  <rect x="501" y="70" width="210" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="606.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">前瞻解码</text>
  <text x="606.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">同时开前瞻与验证两支</text>
  <rect x="25" y="166" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件对前瞻解码的描述是：前瞻支在每个位置各生成一个 token</text>
  <text x="435.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">验证支则从三元组池里验证多个三元组</text>
</svg>
