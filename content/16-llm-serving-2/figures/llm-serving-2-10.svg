<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-10-title fig-llm-serving-2-10-desc">
  <title id="fig-llm-serving-2-10-title">树注意力与两个关键优化</title>
  <desc id="fig-llm-serving-2-10-desc">课件说树注意力对每个 token 的输出与序列注意力相同，没有冗余；它给的两个关键优化是：用深度优先的方式把令牌树线性化，以及一个感知树拓扑的因果掩码。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">树注意力与两个关键优化</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">树注意力：结果相同，冗余消失</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">优化一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">按深度优先把树拉成一条序列</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">优化二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">用感知树结构的因果掩码</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「结果相同」这句话很重要</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它说明这是一次纯粹的效率改进，不改变模型的输出分布</text>
</svg>
