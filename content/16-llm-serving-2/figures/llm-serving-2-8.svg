<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-8-title fig-llm-serving-2-8-desc">
  <title id="fig-llm-serving-2-8-title">令牌树：把多个候选压成一棵树</title>
  <desc id="fig-llm-serving-2-8-desc">课件把令牌树描述成一种紧凑地表示投机出来的多个 token 的方式；不同候选共享相同前缀，于是树的分支处才分叉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">令牌树：把多个候选压成一棵树</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">令牌树：共同前缀只存一份</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它省了什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">重复的前缀不再各存一份</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它带来什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一次前向覆盖多条候选路径</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">树这个结构在第 14 讲也出现过</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">RadixAttention 用它表示请求之间的共同前缀，这里用它表示候选之间的共同前缀</text>
</svg>
