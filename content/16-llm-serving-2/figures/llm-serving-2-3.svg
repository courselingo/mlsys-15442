<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-3-title fig-llm-serving-2-3-desc">
  <title id="fig-llm-serving-2-3-title">大模型与小模型的取舍</title>
  <desc id="fig-llm-serving-2-3-desc">课件把两者的优缺点并列：大模型生成质量更好但慢且贵；小模型便宜又快但不够准。课件给的三档参数量是 1750 亿、130 亿、27 亿。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">大模型与小模型的取舍</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">大模型与小模型，各有长短</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">大模型</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">质量好，但慢且贵</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">小模型</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">快且便宜，但不够准</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">投机解码要做的，就是把两者的优点接起来</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">用小模型的快，去换大模型的准</text>
</svg>
