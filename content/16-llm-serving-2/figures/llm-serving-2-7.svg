<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 810 312.0" width="810" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-7-title fig-llm-serving-2-7-desc">
  <title id="fig-llm-serving-2-7-title">小模型从哪来</title>
  <desc id="fig-llm-serving-2-7-desc">课件列了几种获得草稿模型的途径：量化后的大模型、蒸馏出来的大模型、微调出来的小模型，以及直接训练的小投机模型。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="810" height="312.0" fill="#ffffff"/>

  <text x="407.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">小模型从哪来</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">草稿模型的几种来源</text>
  <rect x="25" y="138" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">量化</text>
  <text x="110.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">大模型降精度</text>
  <rect x="223" y="138" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="308.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">蒸馏</text>
  <text x="308.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">从大模型学</text>
  <rect x="421" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">微调</text>
  <text x="506.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">训成小模型</text>
  <rect x="619" y="138" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="704.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">直接训练</text>
  <text x="704.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">独立的小投机模型</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件还讲了一种集体调优的做法</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">把多个小模型的预测合起来当草稿</text>
</svg>
