<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-2-title fig-llm-serving-2-2-desc">
  <title id="fig-llm-serving-2-2-title">回顾：逐 token 解码的两个瓶颈</title>
  <desc id="fig-llm-serving-2-2-desc">课件重申了上一讲的两个问题：并行度有限，GPU 资源用不满；而且每生成一个 token 都要读一遍全部参数，所以瓶颈在显存访问而不是计算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">回顾：逐 token 解码的两个瓶颈</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">上一讲留下的两个瓶颈</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">瓶颈一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">一次只解码一个 token，并行度有限</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">瓶颈二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">要读全部参数，卡在显存访问上</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第二条是关键</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">既然瓶颈是「读了多少权重」而不是「算了多少」，那么多算几个 token 几乎是免费的</text>
</svg>
