<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 244.0" width="754" height="244.0"
     role="img" aria-labelledby="fig-llm-serving-2-1-title fig-llm-serving-2-1-desc">
  <title id="fig-llm-serving-2-1-title">这一讲把投机解码讲成两条路线</title>
  <desc id="fig-llm-serving-2-1-desc">课件的大纲把投机解码分成两类：基于模型的（用一个单独的草稿模型来猜）与不基于模型的（用输入本身里的重复来猜）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="244.0" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲把投机解码讲成两条路线</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">基于模型</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">用一个小模型当草稿</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">不基于模型</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">用提示词与历史里的重复</text>
  <rect x="25" y="166" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">两条路线的共同点是「先猜一批，再一次性验证」</text>
  <text x="375.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">区别只在猜的根据从哪来</text>
</svg>
