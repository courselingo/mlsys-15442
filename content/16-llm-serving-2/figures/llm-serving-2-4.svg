<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-2-4-title fig-llm-serving-2-4-desc">
  <title id="fig-llm-serving-2-4-title">投机解码的两步</title>
  <desc id="fig-llm-serving-2-4-desc">课件给的做法是：先让一个小模型（课件缩写为 SSM）去预测大模型的输出，它跑得快得多；再让大模型去验证这些小模型的预测。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">投机解码的两步</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">投机解码：先猜，再验</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">第一步 猜</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">小模型预测接下来几个 token</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">第二步 验</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">大模型一次性验证这些预测</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件强调小模型比大模型快得多</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而验证这一步的代价与「只解码一个 token」几乎一样</text>
</svg>
