<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-4-title fig-mixture-of-experts-4-desc">
  <title id="fig-mixture-of-experts-4-title">门控：谁决定用哪个专家</title>
  <desc id="fig-mixture-of-experts-4-desc">课件的结构里有一个门控环节，它根据输入算出一组权重，再据此挑出要用哪些专家；于是每一份输入实际只经过少数几个专家。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">门控：谁决定用哪个专家</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">门控负责挑专家</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">它输出什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">一组专家上的权重</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">后果是什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">每份输入只用少数几个专家</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「只用少数几个」是整件事的关键</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它带来参数量与计算量的脱钩，也带来后面所有系统问题</text>
</svg>
