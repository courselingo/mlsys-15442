<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-12-title fig-mixture-of-experts-12-desc">
  <title id="fig-mixture-of-experts-12-title">再看一次批量计算</title>
  <desc id="fig-mixture-of-experts-12-desc">有了置换之后，计算就回到规整的样子：每个专家各自处理一段连续的输入。课件用这一步把「稀疏」变成了「若干段稠密」。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">再看一次批量计算</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">每个专家处理一段连续的输入</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">看起来像什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">几个大小不一的稠密矩阵乘</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">还剩什么问题</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">各段大小不一，负载会不均</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一段的大小由路由决定，事先不知道</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是「怎么把这些段分给设备」就成了系统问题</text>
</svg>
