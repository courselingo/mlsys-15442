<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-5-title fig-mixture-of-experts-5-desc">
  <title id="fig-mixture-of-experts-5-title">与线性层相比，优势在哪</title>
  <desc id="fig-mixture-of-experts-5-desc">课件在这一页留了一道讨论题：用混合专家相比直接用线性层有什么好处。这个问题没有标准答案写在页上，但可以从它的结构推。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">与线性层相比，优势在哪</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">课件在这里留了一道讨论题</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">一个角度</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">容量与计算量解耦</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">另一个角度</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">不同输入可以用不同的参数</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件只提问、没给答案</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">上面两条是我们就它的结构补的解读</text>
</svg>
