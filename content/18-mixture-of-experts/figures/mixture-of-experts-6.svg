<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-6-title fig-mixture-of-experts-6-desc">
  <title id="fig-mixture-of-experts-6-title">把它装进 Transformer：只换一层</title>
  <desc id="fig-mixture-of-experts-6-desc">课件的做法是直接把 Transformer 里的前馈层换成混合专家，其余结构不动。也就是说，这是一次局部替换，而不是重新设计一个模型。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把它装进 Transformer：只换一层</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">把前馈层换成混合专家，其余不动</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">换掉什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">那一个前馈层</text>
  <rect x="393" y="138" width="340" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="563.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">不动什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">注意力与归一化照旧</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">局部替换的好处是改动可控</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">代价是稀疏性从这一层开始向外扩散</text>
</svg>
