<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-7-title fig-mixture-of-experts-7-desc">
  <title id="fig-mixture-of-experts-7-title">单批次下的样子</title>
  <desc id="fig-mixture-of-experts-7-desc">课件从最简单的设定讲起：只有一份输入。门控算出权重之后给出专家下标，于是这份输入只被送到它选中的那几个专家去算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">单批次下的样子</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">单份输入：门控给出一个专家下标</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">门控的输出</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每个专家上的权重</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">接着做什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">按权重取专家下标</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">单个输入时这很简单</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">一变成一批输入，问题就出在「每份选的专家不一样」</text>
</svg>
