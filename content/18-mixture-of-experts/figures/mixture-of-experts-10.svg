<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-10-title fig-mixture-of-experts-10-desc">
  <title id="fig-mixture-of-experts-10-title">路由与置换</title>
  <desc id="fig-mixture-of-experts-10-desc">要按专家分组，就得把输入重新排一遍：根据路由结果算出每个输入该去哪个专家，然后按专家顺序把它们排好，算完再排回来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">路由与置换</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">先按专家重排，算完再排回来</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">排之前</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">输入按原来的顺序</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">排之后</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">同一个专家的输入连续存放</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件用两份以上输入的例子演示了这个重排</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">算完还要还原，所以需要两套下标</text>
</svg>
