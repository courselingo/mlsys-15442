<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-mixture-of-experts-2-title fig-mixture-of-experts-2-desc">
  <title id="fig-mixture-of-experts-2-title">回顾：Transformer 里那个前馈层</title>
  <desc id="fig-mixture-of-experts-2-desc">课件先用一页回顾 Transformer 块：归一化、前馈层、矩阵乘、softmax、再矩阵乘。这一讲要换掉的正是其中的前馈层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">回顾：Transformer 里那个前馈层</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">Transformer 块：归一化、注意力、前馈层</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">注意力那一半</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">矩阵乘、softmax、再矩阵乘</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">前馈那一半</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">两个线性层夹一个激活</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件那一页的文字层里有个裸的「8-3」</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲改的是后一半，前一半不动</text>
</svg>
