<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-7-title fig-ml-compiler-data-layout-7-desc">
  <title id="fig-ml-compiler-data-layout-7-title">分布式轴：从一块卡扩到多块卡</title>
  <desc id="fig-ml-compiler-data-layout-7-desc">课件给了两个轴名，gpuid_y 与 gpuid_x，用来表示数据落在哪一块设备上；加了这一层轴之后，同一套记号能同时描述卡内的摆放与卡间的分配。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分布式轴：从一块卡扩到多块卡</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">给步长加上设备轴，就得到分布式布局</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">卡内的部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">用 @m 这类轴描述</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">卡间的部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">用 @gpuid_x、@gpuid_y 描述</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">一套记号覆盖从寄存器到多机的全部层级</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是这套写法的主要价值</text>
</svg>
