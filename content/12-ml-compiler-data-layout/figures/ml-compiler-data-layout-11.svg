<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 340.0" width="846" height="340.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-11-title fig-ml-compiler-data-layout-11-desc">
  <title id="fig-ml-compiler-data-layout-11-title">swizzle：给地址做一次重映射</title>
  <desc id="fig-ml-compiler-data-layout-11-desc">做法是在地址里做一些位的交换，把本来会撞到同一个 bank 的一批访问打散到不同 bank 上；它改变的是地址的顺序，不改变数据本身。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="340.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">swizzle：给地址做一次重映射</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">它改变什么</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">地址落在哪个 bank</text>
  <rect x="25" y="166" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="195.7" font-size="15" fill="#b45309" text-anchor="middle">它不改变什么</text>
  <text x="195.0" y="213.7" font-size="12" fill="#b45309" text-anchor="middle">存了哪些数据、算出来是什么</text>
  <rect x="25" y="262" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">所以它是一种纯粹的访存优化</text>
  <text x="425.0" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">和精度、结果都无关</text>
</svg>
