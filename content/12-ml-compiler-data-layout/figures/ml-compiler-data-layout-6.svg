<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-6-title fig-ml-compiler-data-layout-6-desc">
  <title id="fig-ml-compiler-data-layout-6-title">线程与寄存器：两级具名轴同时出现</title>
  <desc id="fig-ml-compiler-data-layout-6-desc">课件给的例子是 S[(8, 4, 2) : (4@laneid, 1@laneid, 1@reg)]：前两段步长标着 laneid，说明由同一条线程内的不同 lane 承担；最后一段标着 reg，落在寄存器上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">线程与寄存器：两级具名轴同时出现</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一份数据同时由 lane 与寄存器两级承担</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">标注为 @laneid 的部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">由同一条线程内的 lane 分担</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">标注为 @reg 的部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">落在寄存器上</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一步把「谁算哪一块」写成了布局的一部分</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">第 6 讲讲的线程坐标在这里变成了布局的轴</text>
</svg>
