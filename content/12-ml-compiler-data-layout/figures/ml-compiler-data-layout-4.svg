<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-4-title fig-ml-compiler-data-layout-4-desc">
  <title id="fig-ml-compiler-data-layout-4-title">分块布局：在形状-步长上再叠一层</title>
  <desc id="fig-ml-compiler-data-layout-4-desc">8 乘 8 的矩阵按 2 乘 4 分块，形状被重写成 (4, 2, 2, 4)，四段步长分别是 16、4、8、1；地址就是把四个下标各自乘上对应步长再相加。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分块布局：在形状-步长上再叠一层</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">8×8 的矩阵按 2×4 分块</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">重写后的形状</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">(4, 2, 2, 4)</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">对应的步长</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">(16, 4, 8, 1)</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">A[2, 3] 落在偏移 19</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件把这一步叫分块布局的推导</text>
</svg>
