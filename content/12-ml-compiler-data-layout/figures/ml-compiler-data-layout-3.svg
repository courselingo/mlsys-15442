<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-3-title fig-ml-compiler-data-layout-3-desc">
  <title id="fig-ml-compiler-data-layout-3-title">形状-步长：一种写法把布局说清楚</title>
  <desc id="fig-ml-compiler-data-layout-3-desc">课件的写法是 S[(形状) : (步长)]，例如 S[(4, 4) : (4, 1)]；地址等于 i 乘 4 加 j 乘 1，所以 A[2,3] 落在偏移 11 的位置。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">形状-步长：一种写法把布局说清楚</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">形状-步长记号：S[(形状) : (步长)]</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">一个例子</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">S[(4, 4) : (4, 1)]</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">算法</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">i 乘 4 加 j 乘 1</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">A[2, 3] 落在偏移 11</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件注明这套记号是 CuTe 的简化版，并采用行优先</text>
</svg>
