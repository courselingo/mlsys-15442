<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-9-title fig-ml-compiler-data-layout-9-desc">
  <title id="fig-ml-compiler-data-layout-9-title">内存 bank：能并行读的前提是落在不同 bank</title>
  <desc id="fig-ml-compiler-data-layout-9-desc">课件给的背景是不同 bank 可以被并行读出；判断规则很简单，地址取模 bank 数，落在同一个 bank 上的访问只能排队。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">内存 bank：能并行读的前提是落在不同 bank</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">bank 数固定，地址对 bank 数取模决定落在哪</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">能并行的情况</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">各次访问落在不同的 bank</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">要排队的情况</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">多次访问落在同一个 bank</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条规则本身很简单</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">麻烦在于默认的行优先布局经常会让它踩雷</text>
</svg>
