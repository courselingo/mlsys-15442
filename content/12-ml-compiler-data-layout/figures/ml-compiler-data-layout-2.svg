<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-2-title fig-ml-compiler-data-layout-2-desc">
  <title id="fig-ml-compiler-data-layout-2-title">数据布局：从逻辑下标到物理位置</title>
  <desc id="fig-ml-compiler-data-layout-2-desc">课件的定义是把逻辑下标映射到数据所在的物理位置；这个位置可以是一维内存里的某个偏移，也可以是某一块设备上的某一块存储。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">数据布局：从逻辑下标到物理位置</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">数据布局 = 逻辑下标到物理位置的映射</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">一个逻辑下标</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">比如 A[i, j]</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">一个物理位置</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">一维内存里的偏移，或某块设备</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">同一份数据可以有很多种布局</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">选哪一种，决定了后续能不能算得快</text>
</svg>
