<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-5-title fig-ml-compiler-data-layout-5-desc">
  <title id="fig-ml-compiler-data-layout-5-title">具名轴：把硬件的维度写进步长里</title>
  <desc id="fig-ml-compiler-data-layout-5-desc">课件指出需要表示不同的硬件轴，比如张量内存里的 lane 与列、以及线程下标；做法是给步长加标签，例如 16@m 表示按普通内存的 16 步长，m 就是普通内存这个轴。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">具名轴：把硬件的维度写进步长里</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">给步长加标签，说明它属于哪个硬件轴</text>
  <rect x="25" y="138" width="360" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="205.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">一个行优先的 8×16</text>
  <text x="205.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">S[(8, 16) : (16@m, 1@m)]</text>
  <rect x="413" y="138" width="320" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="573.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">标签还能是别的</text>
  <text x="573.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">@warpid、@tmemcol 等</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">为什么需要具名轴</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">不同的轴由不同的硬件单元负责，写清楚才能对准硬件</text>
</svg>
