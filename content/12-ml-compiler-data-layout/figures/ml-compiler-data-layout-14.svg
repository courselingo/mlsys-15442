<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 244.0" width="876" height="244.0"
     role="img" aria-labelledby="fig-ml-compiler-data-layout-14-title fig-ml-compiler-data-layout-14-desc">
  <title id="fig-ml-compiler-data-layout-14-title">三种布局各管一个尺度</title>
  <desc id="fig-ml-compiler-data-layout-14-desc">分块与线程布局管「数据在一块卡内部怎么摆」，分布式布局管「数据在哪几块卡上」，swizzle 管「同一块存储里的地址顺序」。三者解决的问题不一样，但用的是同一套记号。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="244.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种布局各管一个尺度</text>
  <rect x="25" y="70" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">分块与线程</text>
  <text x="110.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">卡内的摆放</text>
  <rect x="223" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">分布式</text>
  <text x="308.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">卡间的分配</text>
  <rect x="421" y="70" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="506.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">swizzle</text>
  <text x="506.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">存储内的顺序</text>
  <rect x="619" y="70" width="170" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="704.0" y="99.7" font-size="15" fill="#6b21a8" text-anchor="middle">同一套记号</text>
  <text x="704.0" y="117.7" font-size="12" fill="#6b21a8" text-anchor="middle">三层可叠</text>
  <rect x="25" y="166" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">从寄存器到多机，用同一种写法描述</text>
  <text x="440.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是把布局当成一等公民的好处</text>
</svg>
