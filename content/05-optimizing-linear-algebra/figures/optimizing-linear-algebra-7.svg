<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 666 335.0" width="666" height="335.0"
     role="img" aria-labelledby="fig-optimizing-linear-algebra-7-title fig-optimizing-linear-algebra-7-desc">
  <title id="fig-optimizing-linear-algebra-7-title">内存层级：越靠近计算越快，也越小</title>
  <desc id="fig-optimizing-linear-algebra-7-desc">课件引的是那组经典的延迟数字：寄存器约 0.5 纳秒，L1 约 7 纳秒，L2 约 200 纳秒，再往外是 DRAM；每一级差一到两个数量级。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="666" height="335.0" fill="#ffffff"/>

  <text x="335.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">内存层级：越靠近计算越快，也越小</text>
  <rect x="25" y="70" width="200" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="125.0" y="97.8" font-size="15" fill="#1e40af" text-anchor="middle">寄存器 约 0.5 纳秒</text>
  <rect x="25" y="140" width="340" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.8" font-size="15" fill="#1e40af" text-anchor="middle">L1 缓存 约 7 纳秒</text>
  <rect x="25" y="210" width="480" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="265.0" y="237.8" font-size="15" fill="#1e40af" text-anchor="middle">L2 缓存 约 200 纳秒</text>
  <rect x="25" y="280" width="620" height="45" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="335.0" y="307.8" font-size="15" fill="#1e40af" text-anchor="middle">DRAM 更慢，但容量大得多</text>
</svg>
