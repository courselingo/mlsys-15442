<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 260.0" width="754" height="260.0"
     role="img" aria-labelledby="fig-optimizing-linear-algebra-8-title fig-optimizing-linear-algebra-8-desc">
  <title id="fig-optimizing-linear-algebra-8-title">把账算出来：瓶颈不在算，在搬</title>
  <desc id="fig-optimizing-linear-algebra-8-desc">课件给的量级是：寄存器里的乘加是 n³ 次，而从 DRAM 载入的次数是 2n³ 次，每一次都要等一次访存的延迟；两者差出好几个数量级。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="260.0" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把账算出来：瓶颈不在算，在搬</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">寄存器里的时间</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">n³ 次乘加</text>
  <rect x="25" y="163" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="192.7" font-size="15" fill="#9d174d" text-anchor="middle">从 DRAM 载入的时间</text>
  <text x="195.0" y="210.7" font-size="12" fill="#9d174d" text-anchor="middle">2n³ 次载入 × 每次访存的延迟</text>
  <rect x="393" y="70" width="340" height="180" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="146.7" font-size="15" fill="#9d174d" text-anchor="middle">差好几个数量级</text>
  <text x="563.0" y="164.7" font-size="12" fill="#9d174d" text-anchor="middle">瓶颈不在算，在搬</text>
  <text x="563.0" y="182.7" font-size="12" fill="#9d174d" text-anchor="middle">所以优化的方向是少搬几次</text>
</svg>
