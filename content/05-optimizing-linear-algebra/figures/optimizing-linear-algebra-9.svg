<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 807 312.0" width="807" height="312.0"
     role="img" aria-labelledby="fig-optimizing-linear-algebra-9-title fig-optimizing-linear-algebra-9-desc">
  <title id="fig-optimizing-linear-algebra-9-title">第一层：寄存器分块</title>
  <desc id="fig-optimizing-linear-algebra-9-desc">把三个维度各切一刀，一次算出一小块 C：a 被复用 v2 次，b 被复用 v1 次；乘加次数本身不随分块改变，仍是 n³，而 a 的载入次数降到 n³ 除以 v2。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="807" height="312.0" fill="#ffffff"/>

  <text x="405.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第一层：寄存器分块</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">寄存器分块：一次算出一小块 C</text>
  <rect x="25" y="138" width="235" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="142.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">沿 i 方向分块</text>
  <text x="142.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">块大小 v1</text>
  <rect x="288" y="138" width="235" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="405.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">沿 j 方向分块</text>
  <text x="405.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">块大小 v2</text>
  <rect x="551" y="138" width="235" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="668.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">沿 k 方向分块</text>
  <text x="668.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">块大小 v3</text>
  <rect x="25" y="234" width="761" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="405.5" y="263.7" font-size="15" fill="#166534" text-anchor="middle">a 被复用 v2 次，b 被复用 v1 次</text>
  <text x="405.5" y="281.7" font-size="12" fill="#166534" text-anchor="middle">乘加次数不变（仍是 n³），a 的载入次数降到 n³ / v2</text>
</svg>
