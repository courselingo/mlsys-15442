<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-optimizing-linear-algebra-12-title fig-optimizing-linear-algebra-12-desc">
  <title id="fig-optimizing-linear-algebra-12-title">同样的思路放到卷积上，可选的方向更多</title>
  <desc id="fig-optimizing-linear-algebra-12-desc">卷积的输入、权重、输出各是一个四维张量，输出要在三个维度上求和；维度越多，可以找复用的方向也越多，这正是它难优化的原因。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同样的思路放到卷积上，可选的方向更多</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">卷积里的复用更复杂</text>
  <rect x="25" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">输入</text>
  <text x="137.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">n × ci × h × w</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">权重</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">co × ci × K × K</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">输出</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">n × co × h × w</text>
  <rect x="25" y="234" width="731" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.5" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">输出是三个维度上的求和</text>
  <text x="390.5" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是有三个方向可以找复用</text>
</svg>
