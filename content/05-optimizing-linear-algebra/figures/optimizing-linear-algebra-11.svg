<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 672 232.0" width="672" height="232.0"
     role="img" aria-labelledby="fig-optimizing-linear-algebra-11-title fig-optimizing-linear-algebra-11-desc">
  <title id="fig-optimizing-linear-algebra-11-title">复用的规律：找出不随某个维度变的访问</title>
  <desc id="fig-optimizing-linear-algebra-11-desc">矩阵乘里 A 的访问与 j 无关，把 j 方向切开 v 份，A 就能被复用 v 次；复用越多，搬运越少。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="672" height="232.0" fill="#ffffff"/>

  <text x="338.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">复用的规律：找出不随某个维度变的访问</text>
  <rect x="25" y="70" width="190" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">找出不随某个维度变的访问</text>
  <rect x="243" y="70" width="190" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="338.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">把这个维度切开</text>
  <rect x="461" y="70" width="190" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="556.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">切开的每一份就能复用</text>
  <path d="M220,98 L232,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M438,98 L450,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="25" y="154" width="566" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="308.0" y="183.7" font-size="15" fill="#6b21a8" text-anchor="middle">复用越多，搬运越少</text>
  <text x="308.0" y="201.7" font-size="12" fill="#6b21a8" text-anchor="middle">这就是分块的全部理由</text>
</svg>
