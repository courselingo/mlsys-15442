<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-14-title fig-llm-finetuning-14-desc">
  <title id="fig-llm-finetuning-14-title">量化侧调优：两步走</title>
  <desc id="fig-llm-finetuning-14-desc">课件给的解法是用侧网络当适配器，从而避免对主干做反向传播、也就不必保存主干的激活值；它分两步：先做 4 位分块双重量化，再引入一个与主干分离的侧网络。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">量化侧调优：两步走</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">两步：先量化，再接一个侧网络</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">第一步</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">4 位分块双重量化</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">第二步</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">引入与主干分离的侧网络</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的结论是：与 QLoRA 精度相当而显存更省</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它还用 GPT-4 当裁判做了对话质量的对比</text>
</svg>
