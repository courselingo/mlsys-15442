<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-5-title fig-llm-finetuning-5-desc">
  <title id="fig-llm-finetuning-5-title">前缀调优：把前缀变成参数</title>
  <desc id="fig-llm-finetuning-5-desc">做法是在输入前面接上一串虚拟 token；大模型会像对待普通 token 序列一样关注这段前缀，而大模型本身的参数被冻住，只训练这段前缀的参数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">前缀调优：把前缀变成参数</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">在输入前面接一串虚拟 token</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">冻住什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">大模型的全部参数</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">训练什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">那段前缀的参数</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的出处是 Prefix-Tuning 那份工作</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它把「提示」从离散的文本换成了连续的向量</text>
</svg>
