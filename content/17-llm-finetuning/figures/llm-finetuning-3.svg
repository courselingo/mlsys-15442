<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-3-title fig-llm-finetuning-3-desc">
  <title id="fig-llm-finetuning-3-title">上下文学习与提示工程</title>
  <desc id="fig-llm-finetuning-3-desc">课件先讲了一条不动参数的路线：大模型能从几个输入输出示例里理解任务描述，也就是上下文学习；提示工程则是手工为具体任务设计提示词。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">上下文学习与提示工程</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">不动参数的路线：把任务写在提示里</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">上下文学习</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">从少量示例里理解任务</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">提示工程</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">手工设计提示词</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件引的是 GPT-3 那篇「语言模型是少样本学习者」</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">其中一个典型技巧是把大任务拆成子任务再串起来，也就是思维链提示</text>
</svg>
