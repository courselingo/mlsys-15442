<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-4-title fig-llm-finetuning-4-desc">
  <title id="fig-llm-finetuning-4-title">提示工程的三个局限</title>
  <desc id="fig-llm-finetuning-4-desc">课件列了两条明确的问题：好的提示很难设计，需要大量精力；而且提示不可微，所以不能直接在一个数据集上微调它。课件由此提出了一个问题：能不能让提示变得可训练。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">提示工程的三个局限</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">为什么手工提示不够用</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">局限一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">好提示难写，靠反复试</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">局限二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">不可微，没法按数据集训练</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的这一页以一个提问结束</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">能不能让提示变得可训练、可微</text>
</svg>
