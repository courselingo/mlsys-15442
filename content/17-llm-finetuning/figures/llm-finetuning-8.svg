<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-8-title fig-llm-finetuning-8-desc">
  <title id="fig-llm-finetuning-8-title">LoRA 为什么不增加推理延迟</title>
  <desc id="fig-llm-finetuning-8-desc">因为训练完之后，那两个小矩阵的乘积可以直接并回原来的权重里；于是推理时看到的还是同一个形状的权重，不需要额外计算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">LoRA 为什么不增加推理延迟</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">训练完之后，增量可以并回原权重</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">训练时</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">主干加两个小矩阵，两条路都要算</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">推理时</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">并成一个矩阵，与原来完全一样</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一点把 LoRA 与「加一个额外分支」的做法区分开了</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">后者在推理时也要多算一次</text>
</svg>
