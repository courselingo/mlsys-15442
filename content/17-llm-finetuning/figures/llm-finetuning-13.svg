<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-13-title fig-llm-finetuning-13-desc">
  <title id="fig-llm-finetuning-13-title">LoRA 留下的问题：激活值还要存</title>
  <desc id="fig-llm-finetuning-13-desc">课件指出适配器类方法减少了可训练权重与优化器状态，但反向传播仍然需要保存中间激活值；而主干不参与反传的话，这些激活值本来是可以不存的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">LoRA 留下的问题：激活值还要存</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">参数省下来了，激活值还在</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">省下的部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">可训练权重与优化器状态</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">没省下的部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">反向要用的中间激活值</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条正好接上第 11 讲</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">那一讲讲的是激活值怎么省，这里说明为什么适配器方法省不掉它</text>
</svg>
