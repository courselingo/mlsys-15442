<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-12-title fig-llm-finetuning-12-desc">
  <title id="fig-llm-finetuning-12-title">QLoRA：量化加 LoRA</title>
  <desc id="fig-llm-finetuning-12-desc">课件给的做法是针对单个线性层：主干权重冻成 4 位，LoRA 的两个小矩阵仍以较高精度训练。它给的结论是与全量微调效果相当。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">QLoRA：量化加 LoRA</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">QLoRA：4 位冻住的主干 + 高精度的小矩阵</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">主干</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">4 位量化，冻住不动</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">可训练部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">LoRA 的两个矩阵</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件引的是 QLoRA 那份工作</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它把「省可训练参数」和「省主干显存」两件事叠在了一起</text>
</svg>
