<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 244.0" width="754" height="244.0"
     role="img" aria-labelledby="fig-llm-finetuning-1-title fig-llm-finetuning-1-desc">
  <title id="fig-llm-finetuning-1-title">这一讲的两条路线：调提示，还是调参数</title>
  <desc id="fig-llm-finetuning-1-desc">课件的大纲把高效微调分成两条：调提示（提示工程与前缀调优）与调适配器（适配器、LoRA 以及各种量化变体）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="244.0" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的两条路线：调提示，还是调参数</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">第一条路线</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">改输入，不动模型</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">第二条路线</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">加小模块，冻住原模型</text>
  <rect x="25" y="166" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">两条路线的共同目标都是「可训练的参数越少越好」</text>
  <text x="375.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">区别只在这些参数加在哪里</text>
</svg>
