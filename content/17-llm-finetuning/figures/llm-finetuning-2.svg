<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-2-title fig-llm-finetuning-2-desc">
  <title id="fig-llm-finetuning-2-title">为什么需要微调，以及它有多贵</title>
  <desc id="fig-llm-finetuning-2-desc">课件的定义是从一个预训练好的基础模型出发，为下游任务继续训练模型参数；代价是它需要与从头训练相当的资源：微调 1750 亿参数的 GPT-3 要八十块 A100-40GB。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么需要微调，以及它有多贵</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">微调：从预训练模型出发，为下游任务继续训练</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">在基础模型上继续训练参数</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">代价</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">八十块 A100-40GB，约 1 TB 存储</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件的原话是需要与从头训练相同的资源</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这句话就是这一讲所有方法的动机</text>
</svg>
