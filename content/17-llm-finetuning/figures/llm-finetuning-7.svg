<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-7-title fig-llm-finetuning-7-desc">
  <title id="fig-llm-finetuning-7-title">LoRA：把增量写成低秩分解</title>
  <desc id="fig-llm-finetuning-7-desc">课件的定义是冻住预训练权重，在每一层里注入可训练的秩分解矩阵；也就是说，权重增量被写成两个小矩阵的乘积，而不是一个同样大的矩阵。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">LoRA：把增量写成低秩分解</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">权重增量写成两个小矩阵的乘积</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">冻住什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">预训练权重</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">训练什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">注入的秩分解矩阵</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件还专门讲了一页「把 LoRA 用在注意力上」</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">出处是 Hu 等人 2021 年那篇 LoRA</text>
</svg>
