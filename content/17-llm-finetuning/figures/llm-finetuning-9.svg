<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-llm-finetuning-9-title fig-llm-finetuning-9-desc">
  <title id="fig-llm-finetuning-9-title">两个变体：换一种乘积</title>
  <desc id="fig-llm-finetuning-9-desc">课件给了两个变体：LoHa 用逐元素乘积（哈达玛积），可以在同样多可训练参数下得到更高的秩；LoKr 用克罗内克积替换矩阵乘积，保留了原权重矩阵的秩。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个变体：换一种乘积</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同样的小矩阵，换一种乘法</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">LoHa</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">逐元素乘积，同参数量下秩更高</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">LoKr</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">克罗内克积，保留原权重的秩</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「秩」在这里是关键</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">低秩假设能不能表达出想学的东西，取决于这个秩够不够</text>
</svg>
