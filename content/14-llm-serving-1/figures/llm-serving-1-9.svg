<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-9-title fig-llm-serving-1-9-desc">
  <title id="fig-llm-serving-1-9-title">浪费有多严重</title>
  <desc id="fig-llm-serving-1-9-desc">课件引 vLLM 的数字：KV 缓存里真正用来存 token 状态的只有两到四成，其余都空着。这个比例说明静态分配的浪费不是小数点后面的问题。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">浪费有多严重</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">真正被用上的只有 20% 到 40%</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">用上的部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">两成到四成</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">空着的部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">剩下的一大半</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个数字来自 vLLM 那份工作</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它也是分页这个思路的动机</text>
</svg>
