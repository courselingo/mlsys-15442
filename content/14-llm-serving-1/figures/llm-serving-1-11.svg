<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-11-title fig-llm-serving-1-11-desc">
  <title id="fig-llm-serving-1-11-title">虚拟化之后，注意力怎么算</title>
  <desc id="fig-llm-serving-1-11-desc">课件给了两步：先用块表取出那些物理上不连续的块，再在算注意力的同时把它们用起来。它能成立的关键是注意力满足结合律与交换律。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">虚拟化之后，注意力怎么算</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">用块表取出不连续的块，边算边拼</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">第一步</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">按块表把块取出来</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">第二步</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">在算注意力的过程中即时使用</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">关键前提仍是那条数学性质</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">顺序不影响结果，所以块可以随便放</text>
</svg>
