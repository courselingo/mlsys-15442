<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-8-title fig-llm-serving-1-8-desc">
  <title id="fig-llm-serving-1-8-title">静态分配：按最大长度预留一整块</title>
  <desc id="fig-llm-serving-1-8-desc">课件给的做法是提前按请求的最大长度分配一整块连续内存；后果是两笔碎片：内存碎片，以及因为不知道输出长度而产生的内部碎片。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">静态分配：按最大长度预留一整块</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">按最大长度预留一整块连续内存</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">申请时就按上限要够</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">代价</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">外部碎片与内部碎片各一笔</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">内部碎片来自一个简单的事实</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">要生成多少 token，直到生成完才知道</text>
</svg>
