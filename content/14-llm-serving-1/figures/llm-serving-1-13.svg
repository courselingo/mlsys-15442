<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-13-title fig-llm-serving-1-13-desc">
  <title id="fig-llm-serving-1-13-title">RadixAttention：把前缀复用起来</title>
  <desc id="fig-llm-serving-1-13-desc">课件指出现有系统的做法是请求结束就丢掉缓存；RadixAttention 则用一个基数树（紧凑前缀树）对所有请求维护一份 LRU 缓存，于是公共前缀只需要算一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">RadixAttention：把前缀复用起来</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">现有系统：请求一结束就丢掉缓存</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">新做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">用基数树维护所有请求的缓存</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">回收策略</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">LRU，也就是最近最少使用</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">为什么前缀能复用：同一段前缀在树上只有一条路径</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件引的是 SGLang 那份工作</text>
</svg>
