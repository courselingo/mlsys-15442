<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-4-title fig-llm-serving-1-4-desc">
  <title id="fig-llm-serving-1-4-title">静态批处理为什么会浪费 GPU</title>
  <desc id="fig-llm-serving-1-4-desc">课件列了静态批处理的三个问题：不同请求会在不同迭代上结束；于是 GPU 出现空转周期；新请求也不能立刻进来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">静态批处理为什么会浪费 GPU</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">静态批处理：一批请求一起开始，一起结束</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">请求在不同迭代上完成</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题二与三</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">GPU 空转，新请求进不来</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">根因是「一起结束」这个假设</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而生成任务里，每个请求要生成多少 token 事先并不知道</text>
</svg>
