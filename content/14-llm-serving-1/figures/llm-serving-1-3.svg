<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-llm-serving-1-3-title fig-llm-serving-1-3-desc">
  <title id="fig-llm-serving-1-3-title">为什么服务起来又慢又贵</title>
  <desc id="fig-llm-serving-1-3-desc">课件给的三个数字是：半精度下服务 1750 亿参数的 GPT-3 至少要十块 A100-40GB；生成 256 个 token 要大约 20 秒；而且没法并行处理很多请求。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么服务起来又慢又贵</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">课件的三个数字说明了一件事</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">资源</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">半精度下至少要十块 A100-40GB</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">时间与并发</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">256 个 token 约 20 秒，且难以并行</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">三者加起来的结论是：这不是算法问题，而是系统问题</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以后面三块都在改系统的组织方式</text>
</svg>
