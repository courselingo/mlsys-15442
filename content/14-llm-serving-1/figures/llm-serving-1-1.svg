<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 746 244.0" width="746" height="244.0"
     role="img" aria-labelledby="fig-llm-serving-1-1-title fig-llm-serving-1-1-desc">
  <title id="fig-llm-serving-1-1-title">这一讲的三块，都是围绕 KV 缓存做文章</title>
  <desc id="fig-llm-serving-1-1-desc">课件的大纲是连续批处理、PagedAttention、RadixAttention。前一块管「谁来算」，后两块管「算过的东西怎么存与怎么复用」。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="746" height="244.0" fill="#ffffff"/>

  <text x="375.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的三块，都是围绕 KV 缓存做文章</text>
  <rect x="25" y="70" width="210" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">连续批处理</text>
  <text x="130.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">谁来算这一批</text>
  <rect x="263" y="70" width="210" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="368.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">PagedAttention</text>
  <text x="368.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">缓存怎么存</text>
  <rect x="501" y="70" width="210" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="606.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">RadixAttention</text>
  <text x="606.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">缓存怎么复用</text>
  <rect x="25" y="166" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">后两块都建立在「缓存是稀缺资源」这个前提上</text>
  <text x="375.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">而缓存之所以稀缺，是因为它会一直长</text>
</svg>
