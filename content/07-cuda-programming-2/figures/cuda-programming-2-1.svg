<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 782 312.0" width="782" height="312.0"
     role="img" aria-labelledby="fig-cuda-programming-2-1-title fig-cuda-programming-2-1-desc">
  <title id="fig-cuda-programming-2-1-title">案例一的第一版：一个线程算一个元素</title>
  <desc id="fig-cuda-programming-2-1-desc">最直白的写法让每个线程负责输出矩阵的一个元素；代价是每个元素都要读一整行与一整列，而相邻线程读的东西大量重叠。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="782" height="312.0" fill="#ffffff"/>

  <text x="393.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">案例一的第一版：一个线程算一个元素</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">先写一版最直白的</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每个线程算 C 的一个元素</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">代价</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">每个元素要读一整行与一整列</text>
  <rect x="25" y="234" width="736" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="393.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">同一份数据被反复读</text>
  <text x="393.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">相邻线程读的还有大量重叠</text>
</svg>
