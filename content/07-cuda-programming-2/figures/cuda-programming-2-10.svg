<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-cuda-programming-2-10-title fig-cuda-programming-2-10-desc">
  <title id="fig-cuda-programming-2-10-title">另一个维度：多个线程要访问连续的地址</title>
  <desc id="fig-cuda-programming-2-10-desc">课件给的定义是，多个 GPU 线程访问连续的内存地址。这样一次内存事务就能服务整个 warp，显存带宽才用得上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">另一个维度：多个线程要访问连续的地址</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">合并访存：多个线程访问连续的内存地址</text>
  <rect x="25" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="137.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">连续访问</text>
  <text x="137.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">这是访存效率的前提</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">一次事务服务整个 warp</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">这是访存效率的前提</text>
  <rect x="531" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="643.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">带宽才用得起来</text>
  <text x="643.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">这是访存效率的前提</text>
  <rect x="25" y="234" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="137.5" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">反过来</text>
  <text x="137.5" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">带宽被浪费掉</text>
  <rect x="278" y="234" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="390.5" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">每个线程各跳一段</text>
  <text x="390.5" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">带宽被浪费掉</text>
  <rect x="531" y="234" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="643.5" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">事务数成倍增加</text>
  <text x="643.5" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">带宽被浪费掉</text>
</svg>
