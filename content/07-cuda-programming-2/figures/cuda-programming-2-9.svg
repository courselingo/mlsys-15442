<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 762 244.0" width="762" height="244.0"
     role="img" aria-labelledby="fig-cuda-programming-2-9-title fig-cuda-programming-2-9-desc">
  <title id="fig-cuda-programming-2-9-title">版本二：换成跨步索引，发散消失</title>
  <desc id="fig-cuda-programming-2-9-desc">把下标算法换成「线程下标乘以两倍步长」，让同一个 warp 内的线程进入同一分支；判断条件变成单调的，warp 内不再交替真假。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="762" height="244.0" fill="#ffffff"/>

  <text x="383.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">版本二：换成跨步索引，发散消失</text>
  <rect x="25" y="70" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">版本二</text>
  <text x="195.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">线程下标乘两倍步长</text>
  <rect x="393" y="70" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">效果</text>
  <text x="563.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">判断变成单调的，不再交替真假</text>
  <rect x="25" y="166" width="716" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">warp 内不再交替真假</text>
  <text x="383.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">但跨步取址本身并不合并，课件后面还有一段</text>
</svg>
