<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-cuda-programming-2-8-title fig-cuda-programming-2-8-desc">
  <title id="fig-cuda-programming-2-8-title">版本一：交错寻址，问题出在发散</title>
  <desc id="fig-cuda-programming-2-8-desc">版本一让相邻的步长负责相邻的数据，条件是线程下标能被 2s 整除；于是同一时刻只有一部分线程在工作，出现了发散。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">版本一：交错寻址，问题出在发散</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">版本一：交错寻址</text>
  <rect x="25" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="137.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">步长逐轮翻倍</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">参与条件</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">下标能被 2s 整除</text>
  <rect x="531" y="138" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="643.5" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">后果</text>
  <text x="643.5" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">同一个 warp 里</text>
  <rect x="25" y="234" width="760" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="405.0" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">一个 warp 里只有一部分线程在做</text>
  <text x="405.0" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">这就是发散，课件把它列为要消除的问题</text>
</svg>
