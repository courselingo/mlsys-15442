<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-3-title fig-kernel-superoptimization-3-desc">
  <title id="fig-kernel-superoptimization-3-title">硬件既高度并行，又高度异构</title>
  <desc id="fig-kernel-superoptimization-3-desc">课件给的数字是：上百个流多处理器、每个 SM 128 个 CUDA 核心与 4 个张量核心、上千到十万块 GPU、以及一张高性能网络。层级很多，形态各不相同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">硬件既高度并行，又高度异构</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">从一块卡内部到整个集群</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">卡内</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">上百个 SM、128 个 CUDA 核心、4 个张量核心</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">卡间</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">上千到十万块 GPU，靠高性能网络连起来</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">层级多意味着可以切的地方多</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">也意味着「切在哪里最划算」这件事变得越来越难判断</text>
</svg>
