<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-12-title fig-kernel-superoptimization-12-desc">
  <title id="fig-kernel-superoptimization-12-title">抽象表达式：让搜索变得可扩展</title>
  <desc id="fig-kernel-superoptimization-12-desc">课件给的难处是搜索空间极大；它的解法是抽象表达式，做法是把张量计算里的下标细节抹掉，只保留子表达式之间的关系；于是可以用一阶逻辑去推理。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">抽象表达式：让搜索变得可扩展</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">抽象表达式：抹掉下标细节，保留关系</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">抹掉什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">张量计算里的下标细节</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">保留什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">子表达式之间的关系</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件用两个目标概括它</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">一是抓住子图之间的关系，二是判断两个表达式是否等价</text>
</svg>
