<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 244.0" width="754" height="244.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-1-title fig-kernel-superoptimization-1-desc">
  <title id="fig-kernel-superoptimization-1-title">这一讲问的是：ML 成功的推动力是什么</title>
  <desc id="fig-kernel-superoptimization-1-desc">课件从这个问题出发，把答案归到算力与规模上，再由此引出这一讲的主题：怎么把这些硬件的能力自动榨出来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="244.0" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲问的是：ML 成功的推动力是什么</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">课件的问题</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">推动力是什么</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">它给的答案</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">算力与规模</text>
  <rect x="25" y="166" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是问题变成：怎么把这些算力真正用上</text>
  <text x="375.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">而硬件的形态正在快速变化，手写跟不上</text>
</svg>
