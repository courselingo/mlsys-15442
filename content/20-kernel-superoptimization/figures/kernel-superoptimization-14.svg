<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-14-title fig-kernel-superoptimization-14-desc">
  <title id="fig-kernel-superoptimization-14-title">三个案例与它拿到的收益</title>
  <desc id="fig-kernel-superoptimization-14-desc">课件给了三个优化案例：RMSNorm 加线性层（把分母移到矩阵乘之后）、LoRA（把三次矩阵乘与一次加法融成一个内核）、以及门控多层感知机。它给的加速比是 1.4 到 2.7 倍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个案例与它拿到的收益</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">课件给的三个案例与收益</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">案例的共同点</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">都能把若干算子合成一个内核</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">收益</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">1.4 到 2.7 倍，LoRA 那个是 2.3 倍</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件还说它发现的图与专家手写的实现相似</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">并且能在新硬件上用上新的互联方式</text>
</svg>
