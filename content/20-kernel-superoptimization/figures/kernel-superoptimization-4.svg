<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-4-title fig-kernel-superoptimization-4-desc">
  <title id="fig-kernel-superoptimization-4-title">硬件还在快速演进</title>
  <desc id="fig-kernel-superoptimization-4-desc">课件用两页对照了不同代的硬件结构：设备内存、SM、CUDA 核心、张量核心的排布在变；每一代都会带来新的组织方式与新的优化空间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">硬件还在快速演进</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">每一代硬件都会重排一次这些单元</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">变的是什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">单元的数量、组织与互联</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">不变的是什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">都要把数据搬进来再算</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">手写的内核跟不上这个变化速度</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这正是自动搜索值得投入的理由</text>
</svg>
