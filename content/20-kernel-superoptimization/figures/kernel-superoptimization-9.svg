<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-9-title fig-kernel-superoptimization-9-desc">
  <title id="fig-kernel-superoptimization-9-title">例子：分组查询注意力</title>
  <desc id="fig-kernel-superoptimization-9-desc">课件用分组查询注意力演示：PyTorch 的写法里有一串重复与矩阵乘；而用 FlashDecoding 的做法是把它拆成两个内核，前提是把 softmax 拆成指数、三次求和与一次除法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">例子：分组查询注意力</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一个注意力，几种不同的图</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">原始写法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">重复、矩阵乘、softmax 串起来</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">另一种写法</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">拆成两个内核，softmax 分解</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两者算的是同一件事</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">但它们的代价结构完全不同，这正是搜索要比较的东西</text>
</svg>
