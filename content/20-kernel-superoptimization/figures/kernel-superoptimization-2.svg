<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-2-title fig-kernel-superoptimization-2-desc">
  <title id="fig-kernel-superoptimization-2-title">三条推动力是相互咬合的</title>
  <desc id="fig-kernel-superoptimization-2-desc">课件把三条线画在一起：训练与推理的算力在涨、硬件走向并行与专用、模型的精度与能力在提升；它们互相推动，而不是各自独立。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条推动力是相互咬合的</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">三条线互相推动</text>
  <rect x="25" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="137.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">算力在涨</text>
  <text x="137.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">训练与推理都吃算力</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">硬件在变</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">更并行、更专用</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">模型在强</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">精度与能力同时提升</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件在这一页标了两个来源：OpenAI 与 NVIDIA</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">三者的关系是：模型要更多算力，硬件给出更多算力，模型又能用掉它</text>
</svg>
