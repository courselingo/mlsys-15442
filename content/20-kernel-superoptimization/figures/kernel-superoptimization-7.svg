<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-kernel-superoptimization-7-title fig-kernel-superoptimization-7-desc">
  <title id="fig-kernel-superoptimization-7-title">回顾：GPU 编程的基本单位</title>
  <desc id="fig-kernel-superoptimization-7-desc">课件先回顾了 GPU 编程的层次：一个内核、若干线程块、每个块里若干线程，它们共同操作设备内存。这一层的结构是后面「分层图」的基础。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">回顾：GPU 编程的基本单位</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">内核、线程块、线程、设备内存</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">组织方式</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">内核分成块，块分成线程</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">数据位置</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">共享内存与设备内存</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一层在第 6 讲讲过</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲要在它之上再叠一层表示，用来描述「怎么组合算子」</text>
</svg>
