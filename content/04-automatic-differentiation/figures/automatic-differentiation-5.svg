<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 706 403" width="706" height="403"
     role="img" aria-labelledby="fig-automatic-differentiation-5-title fig-automatic-differentiation-5-desc">
  <title id="fig-automatic-differentiation-5-title">把计算写成图：中间变量是节点，依赖是边</title>
  <desc id="fig-automatic-differentiation-5-desc">课件回顾了计算图：输入 x1 与 x2、两个中间变量 v1 = x1 × x2 与 v2 = exp(x1)、一个输出 v3 = v1 + v2。箭头表示谁的结果被谁用到：两个输入都进 v1，x1 另外单独进 v2，v1 与 v2 再都进 v3。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="706" height="403" fill="#ffffff"/>

  <text x="355.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把计算写成图：中间变量是节点，依赖是边</text>

  <rect x="212" y="83" width="284" height="42" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="354" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">输入 x1 与 x2</text>

  <rect x="212" y="150" width="284" height="42" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="354" y="175.2" font-size="12" fill="#b45309" text-anchor="middle">中间变量 v1 = x1 × x2</text>

  <rect x="212" y="217" width="284" height="42" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="354" y="242.2" font-size="12" fill="#b45309" text-anchor="middle">中间变量 v2 = exp(x1)</text>

  <rect x="212" y="284" width="284" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="354" y="309.2" font-size="12" fill="#166534" text-anchor="middle">输出 v3 = v1 + v2</text>

  <path d="M354,130 L354,139" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M354,264 L354,273" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M501,104 C 580,104 580,238 507,238" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M207,171 C 140,171 140,305 201,305" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="25" y="351" width="660" height="42" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="355" y="376.2" font-size="12" fill="#6b21a8" text-anchor="middle">节点与边：节点是输入、中间变量或输出，边表示谁的结果被谁用到</text>
</svg>
