<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 328.0" width="758" height="328.0"
     role="img" aria-labelledby="fig-automatic-differentiation-9-title fig-automatic-differentiation-9-desc">
  <title id="fig-automatic-differentiation-9-title">一个节点被多条路径用到时，要把几份加起来</title>
  <desc id="fig-automatic-differentiation-9-desc">课件把这种情况单独推了一遍：定义部分伴随量，每条路径各算一份，最后求和，才是一个节点的伴随量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="328.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个节点被多条路径用到时，要把几份加起来</text>
  <rect x="25" y="70" width="712" height="56" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="102.9" font-size="14" fill="#9d174d" text-anchor="middle">v1 同时喂给了 v2 与 v3</text>
  <rect x="25" y="154" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="183.7" font-size="15" fill="#1e40af" text-anchor="middle">路径一的那一份</text>
  <text x="195.0" y="201.7" font-size="12" fill="#1e40af" text-anchor="middle">沿 v2 传回来的部分伴随量</text>
  <rect x="393" y="154" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="183.7" font-size="15" fill="#b45309" text-anchor="middle">路径二的那一份</text>
  <text x="563.0" y="201.7" font-size="12" fill="#b45309" text-anchor="middle">沿 v3 传回来的部分伴随量</text>
  <rect x="25" y="250" width="712" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="279.7" font-size="15" fill="#166534" text-anchor="middle">两份相加才是 v1 的伴随量</text>
  <text x="381.0" y="297.7" font-size="12" fill="#166534" text-anchor="middle">分开算、再求和，这就是多路径的处理方式</text>
</svg>
