  <title id="fig-automatic-differentiation-8-title">反向模式：换成伴随量，倒着走一遍</title>
  <desc id="fig-automatic-differentiation-8-desc">上面一排是前向的值，下面一排是伴随量（输出对每个中间变量的偏导）；伴随量按逆拓扑序从输出往输入推。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="730" height="220.0" fill="#ffffff"/>

  <text x="367.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">反向模式：换成伴随量，倒着走一遍</text>
  <rect x="25" y="70" width="150" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="100.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">前向的值</text>
  <rect x="203" y="70" width="150" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="278.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">前向的值</text>
  <rect x="381" y="70" width="150" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="456.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">前向的值</text>
  <rect x="559" y="70" width="150" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="634.0" y="102.9" font-size="14" fill="#1e40af" text-anchor="middle">前向的值</text>
  <rect x="25" y="154" width="150" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="100.0" y="186.9" font-size="14" fill="#b45309" text-anchor="middle">伴随量</text>
  <rect x="203" y="154" width="150" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="278.0" y="186.9" font-size="14" fill="#b45309" text-anchor="middle">伴随量</text>
  <rect x="381" y="154" width="150" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="456.0" y="186.9" font-size="14" fill="#b45309" text-anchor="middle">伴随量</text>
  <rect x="559" y="154" width="150" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="634.0" y="186.9" font-size="14" fill="#b45309" text-anchor="middle">伴随量</text>
  <path d="M180,98 L192,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M198,182 L186,182" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M358,98 L370,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M376,182 L364,182" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M536,98 L548,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
