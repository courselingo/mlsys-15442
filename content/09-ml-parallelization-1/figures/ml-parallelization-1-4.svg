<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 734 244.0" width="734" height="244.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-4-title fig-ml-parallelization-1-4-desc">
  <title id="fig-ml-parallelization-1-4-title">第一版做法：参数服务器</title>
  <desc id="fig-ml-parallelization-1-4-desc">工人把各自的梯度推给参数服务器，参数服务器更新完权重，工人再把新权重拉回来；通信是中心化的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="734" height="244.0" fill="#ffffff"/>

  <text x="369.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第一版做法：参数服务器</text>
  <rect x="25" y="70" width="300" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="175.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">工人</text>
  <text x="175.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">每块卡算一批梯度</text>
  <rect x="353" y="70" width="300" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="503.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">参数服务器</text>
  <text x="503.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">收梯度、更新权重</text>
  <rect x="25" y="166" width="688" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="369.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">推梯度上去，把新权重拉下来</text>
  <text x="369.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件的原话是 push gradients 与 pull parameters back</text>
</svg>
