<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-10-title fig-ml-parallelization-1-10-desc">
  <title id="fig-ml-parallelization-1-10-title">三种 AllReduce 的通信量放在一起看</title>
  <desc id="fig-ml-parallelization-1-10-desc">朴素做法随工人数平方增长，环形与树形则不是；课件把参数服务器、朴素、环形、树形四种放在一页上比较。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种 AllReduce 的通信量放在一起看</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">三种做法的通信量</text>
  <rect x="25" y="138" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="137.5" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">朴素</text>
  <text x="137.5" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">N × (N − 1) × M</text>
  <rect x="278" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="390.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">环形</text>
  <text x="390.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">每个工人约 2M</text>
  <rect x="531" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="643.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">树形</text>
  <text x="643.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">2 × N × M</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">环形那一项与工人数几乎无关</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这是它在实际系统里更常用的原因</text>
</svg>
