<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-10-title fig-ml-parallelization-1-10-desc">
  <title id="fig-ml-parallelization-1-10-title">同一口径下的通信量：朴素带 N 的平方，其余带 N</title>
  <desc id="fig-ml-parallelization-1-10-desc">课件把参数服务器与四种 AllReduce 做法（朴素、环形、树形、蝶形）共五列放在一页上比较。这里统一用全体合计口径：朴素是 N(N−1)M，环形是 2MN，树形是 2NM，蝶形是 NM 乘 log N。换成每个工人口径后，环形的约 2M 才几乎不随工人数变化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一口径下的通信量：朴素带 N 的平方，其余带 N</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">全体合计口径下的通信量</text>
  <rect x="25" y="138" width="170" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="110.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">朴素</text>
  <text x="110.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">N(N−1)M</text>
  <rect x="223" y="138" width="170" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="308.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">环形</text>
  <text x="308.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">2MN</text>
  <rect x="421" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">树形</text>
  <text x="506.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">2NM</text>
  <rect x="619" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="704.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">蝶形</text>
  <text x="704.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">NM 乘 log N</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">差别在幂次：朴素带 N 的平方，其余带 N</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">换成每个工人口径，环形的约 2M 才几乎不随工人数变化</text>
</svg>
