<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 340.0" width="777" height="340.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-5-title fig-ml-parallelization-1-5-desc">
  <title id="fig-ml-parallelization-1-5-title">参数服务器的问题是通信太集中</title>
  <desc id="fig-ml-parallelization-1-5-desc">所有工人都只和参数服务器说话，工人一多，这一个点就成了瓶颈；课件由此提出把通信去中心化，答案就是 AllReduce。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="340.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">参数服务器的问题是通信太集中</text>
  <rect x="25" y="70" width="712" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">中心化通信：所有工人都只和参数服务器说话</text>
  <text x="381.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">工人越多，越挤在同一个点上</text>
  <rect x="25" y="166" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="195.7" font-size="15" fill="#9d174d" text-anchor="middle">后果一</text>
  <text x="195.0" y="213.7" font-size="12" fill="#9d174d" text-anchor="middle">参数服务器成为瓶颈</text>
  <rect x="393" y="166" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="195.7" font-size="15" fill="#9d174d" text-anchor="middle">后果二</text>
  <text x="563.0" y="213.7" font-size="12" fill="#9d174d" text-anchor="middle">无法扩展到很多工人</text>
  <rect x="25" y="262" width="731" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.5" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是要问：怎么把通信去中心化</text>
  <text x="390.5" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件给的答案是 AllReduce</text>
</svg>
