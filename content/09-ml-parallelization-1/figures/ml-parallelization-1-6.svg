<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-6-title fig-ml-parallelization-1-6-desc">
  <title id="fig-ml-parallelization-1-6-title">AllReduce：在多个设备上做逐元素归约</title>
  <desc id="fig-ml-parallelization-1-6-desc">每台设备各有一份梯度，归约之后就都得到同一份完整的和；这是数据并行里唯一必须的通信。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">AllReduce：在多个设备上做逐元素归约</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">AllReduce：在多个设备上做逐元素归约</text>
  <rect x="25" y="138" width="140" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">设备 0</text>
  <text x="95.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">各有一份梯度</text>
  <rect x="193" y="138" width="140" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="263.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">设备 1</text>
  <text x="263.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">各有一份梯度</text>
  <rect x="361" y="138" width="140" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="431.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">设备 2</text>
  <text x="431.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">各有一份梯度</text>
  <rect x="529" y="138" width="140" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="599.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">设备 3</text>
  <text x="599.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">各有一份梯度</text>
  <rect x="25" y="234" width="644" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="347.0" y="263.7" font-size="15" fill="#166534" text-anchor="middle">归约之后，每台设备上都有一份完整的和</text>
  <text x="347.0" y="281.7" font-size="12" fill="#166534" text-anchor="middle">数据并行里必须的通信只有这一件事</text>
</svg>
