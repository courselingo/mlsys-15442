<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 244.0" width="777" height="244.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-1-title fig-ml-parallelization-1-1-desc">
  <title id="fig-ml-parallelization-1-1-title">这一讲从切数据走到显存</title>
  <desc id="fig-ml-parallelization-1-1-desc">先把训练的数据切给多块卡，再解决梯度怎么汇总，最后落到一个装不下的问题：每块卡都得存下一份完整模型。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="244.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲从切数据走到显存</text>
  <rect x="25" y="70" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">第一步 数据并行</text>
  <text x="137.5" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">切数据，模型复制一份</text>
  <rect x="278" y="70" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">第二步 汇总梯度</text>
  <text x="390.5" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">用 AllReduce 做归约</text>
  <rect x="531" y="70" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="643.5" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">第三步 显存</text>
  <text x="643.5" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">每块卡都装着整个模型</text>
  <rect x="25" y="166" width="731" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.5" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">三步走下来，问题从通信转到显存</text>
  <text x="390.5" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">后面一整节都在处理第三步</text>
</svg>
