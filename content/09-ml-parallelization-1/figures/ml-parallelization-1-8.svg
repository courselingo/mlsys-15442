<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 706 458" width="706" height="458"
     role="img" aria-labelledby="fig-ml-parallelization-1-8-title fig-ml-parallelization-1-8-desc">
  <title id="fig-ml-parallelization-1-8-title">环形 AllReduce：把参数切成 N 片，分两步走</title>
  <desc id="fig-ml-parallelization-1-8-desc">N 个工人围成一个环，M 个参数切成 N 片；环上每个工人只把片发给下一个，最后一个传回第一个。第一步各发一片聚合，第二步各发一片广播，两步的轮数照课件原数各写 N 轮。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="706" height="458" fill="#ffffff"/>

  <text x="355.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">环形 AllReduce：把参数切成 N 片，分两步走</text>
  <rect x="25" y="70" width="660" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="355.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">环形 AllReduce：参数切成 N 片，工人围成一个环</text>
  <rect x="25" y="137" width="660" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="355.0" y="166.7" font-size="15" fill="#b45309" text-anchor="middle">第一步 聚合</text>
  <text x="355.0" y="184.7" font-size="12" fill="#b45309" text-anchor="middle">每轮每个工人把一片发给下一个，重复 N 轮</text>
  <rect x="25" y="230" width="660" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="355.0" y="259.7" font-size="15" fill="#166534" text-anchor="middle">第二步 广播</text>
  <text x="355.0" y="277.7" font-size="12" fill="#166534" text-anchor="middle">每轮每个工人把一片结果发给下一个，重复 N 轮</text>

  <rect x="25" y="323" width="146" height="42" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="98" y="348.2" font-size="12" fill="#1e40af" text-anchor="middle">工人 1</text>
  <rect x="196" y="323" width="146" height="42" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="269" y="348.2" font-size="12" fill="#1e40af" text-anchor="middle">工人 2</text>
  <rect x="367" y="323" width="146" height="42" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="440" y="348.2" font-size="12" fill="#1e40af" text-anchor="middle">工人 3</text>
  <rect x="538" y="323" width="146" height="42" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="611" y="348.2" font-size="12" fill="#1e40af" text-anchor="middle">工人 N</text>

  <path d="M176,344 L185,344" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M347,344 L356,344" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M518,344 L527,344" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M611,370 C 611,425 98,425 98,376" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355.0" y="445" font-size="11" fill="#64748b" text-anchor="middle">环上共有 N 个工人：每个把一片发给下一个，最后一个把片传回第一个</text>
</svg>
