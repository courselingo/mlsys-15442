<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-3-title fig-ml-parallelization-1-3-desc">
  <title id="fig-ml-parallelization-1-3-title">数据并行：把数据切开，每块卡留一份完整模型</title>
  <desc id="fig-ml-parallelization-1-3-desc">同一份模型被复制到每块卡上，训练集被切成若干份分给各卡；每块卡只算自己那批数据，算完把梯度汇总起来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">数据并行：把数据切开，每块卡留一份完整模型</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">数据并行：切数据，复制模型</text>
  <rect x="25" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">GPU 1</text>
  <text x="137.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">一份完整模型 + 一批数据</text>
  <rect x="278" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="390.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">GPU 2</text>
  <text x="390.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">一份完整模型 + 一批数据</text>
  <rect x="531" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="643.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">GPU N</text>
  <text x="643.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">一份完整模型 + 一批数据</text>
  <rect x="25" y="234" width="731" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="390.5" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">每块卡都有一份完整模型</text>
  <text x="390.5" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">这一点就是后面显存问题的根源</text>
</svg>
