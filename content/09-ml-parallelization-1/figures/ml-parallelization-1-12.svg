  <rect x="2" y="13.0" width="774" height="312.0" fill="#ffffff"/>

  <text x="389.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">显存里到底装了什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
