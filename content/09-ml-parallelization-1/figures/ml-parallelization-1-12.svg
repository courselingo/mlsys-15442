  <title id="fig-ml-parallelization-1-12-title">显存里到底装了什么</title>
  <desc id="fig-ml-parallelization-1-12-desc">课件把每一项按顺序叠上去：模型的参数、梯度、优化器状态，混合精度下还要多一份 FP32 的参数副本。</desc>

  <defs>
