<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-7-title fig-ml-parallelization-1-7-desc">
  <title id="fig-ml-parallelization-1-7-title">最直接的做法：每个工人发给所有其他人</title>
  <desc id="fig-ml-parallelization-1-7-desc">N 个工人、M 个参数时，整体通信量是 N 乘 N 减 1 再乘 M；它随工人数平方增长，人一多就爆了。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">最直接的做法：每个工人发给所有其他人</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">朴素 AllReduce：每个工人把梯度发给所有其他人</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">通信量</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">N × (N − 1) × M</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">随工人数平方增长</text>
  <rect x="25" y="234" width="686" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="368.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">N 是工人数，M 是参数量</text>
  <text x="368.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">工人一多，这个式子就不可用了</text>
</svg>
