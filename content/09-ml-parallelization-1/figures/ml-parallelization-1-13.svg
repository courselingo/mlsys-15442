<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-1-13-title fig-ml-parallelization-1-13-desc">
  <title id="fig-ml-parallelization-1-13-title">ZeRO：把数据并行里的冗余一项项去掉</title>
  <desc id="fig-ml-parallelization-1-13-desc">三个阶段是递进的：先切优化器状态，再切梯度，最后连参数也切开；省下的显存与多出来的通信一起涨。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">ZeRO：把数据并行里的冗余一项项去掉</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">ZeRO：去掉数据并行里的冗余，三个阶段</text>
  <rect x="25" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">第一阶段</text>
  <text x="137.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">切优化器状态</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">第二阶段</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">再切梯度</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">第三阶段</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">连参数也切</text>
  <rect x="25" y="234" width="686" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="368.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">三个阶段是递进的</text>
  <text x="368.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">省下的显存越多，要补的通信也越多</text>
</svg>
