<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 782 340.0" width="782" height="340.0"
     role="img" aria-labelledby="fig-cuda-programming-1-14-title fig-cuda-programming-1-14-desc">
  <title id="fig-cuda-programming-1-14-title">从 GTX 980 到 H100：什么没变，什么变了</title>
  <desc id="fig-cuda-programming-1-14-desc">课件给的数据是 GTX 980 有 16 个 SMM、算力约 4.6 TFLOPs；到 H100，SMM 还是那个 SMM、每个 SMM 的 warp 数也没变，多出来的是张量核心这类专用单元。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="782" height="340.0" fill="#ffffff"/>

  <text x="393.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从 GTX 980 到 H100：什么没变，什么变了</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">GTX 980（2014）</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">16 个 SMM，4.6 TFLOPs</text>
  <rect x="393" y="70" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">H100（2022）</text>
  <text x="563.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">132 个 SMM，约 1000 TFLOPs</text>
  <rect x="25" y="166" width="340" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="195.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">没变的</text>
  <text x="195.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">SMM 本身、64 个 warp、每 warp 32 线程</text>
  <rect x="393" y="166" width="340" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">变了的</text>
  <text x="563.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">共享内存 96→256 KB，时钟 1064→1110 MHz</text>
  <rect x="25" y="262" width="736" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="393.0" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">算力涨了两百多倍，主因是张量核心</text>
  <text x="393.0" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">SMM 数量也翻了好几倍，这一栏同样不能漏掉</text>
</svg>
