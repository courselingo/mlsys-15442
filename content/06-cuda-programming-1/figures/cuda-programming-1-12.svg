<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -1.0 758 386.0" width="758" height="386.0"
     role="img" aria-labelledby="fig-cuda-programming-1-12-title fig-cuda-programming-1-12-desc">
  <title id="fig-cuda-programming-1-12-title">一个流多处理器里有什么</title>
  <desc id="fig-cuda-programming-1-12-desc">课件给的资源上限是 64 个 warp 执行上下文（最多 2048 个线程）与 96 KB 共享内存；warp 是 32 个线程共用一条指令流。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="-1.0" width="758" height="386.0" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个流多处理器里有什么</text>
  <rect x="25" y="56" width="712" height="210" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="38" y="73.85" font-size="11" fill="#64748b">一个流多处理器（SMM）</text>
  <rect x="45" y="95" width="672" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="381.0" y="127.5" font-size="13" fill="#b45309" text-anchor="middle">64 个 warp 执行上下文，最多 2048 个线程</text>
  <rect x="45" y="176" width="672" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="381.0" y="208.6" font-size="13" fill="#b45309" text-anchor="middle">96 KB 共享内存</text>
  <rect x="25" y="294" width="712" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="323.7" font-size="15" fill="#166534" text-anchor="middle">warp = 32 个线程，共用一条指令流</text>
  <text x="381.0" y="341.7" font-size="12" fill="#166534" text-anchor="middle">同一时刻从常驻的 warp 里挑几个来跑</text>
</svg>
