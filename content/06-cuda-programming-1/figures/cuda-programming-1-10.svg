<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-cuda-programming-1-10-title fig-cuda-programming-1-10-desc">
  <title id="fig-cuda-programming-1-10-title">编译要解决的兼容问题：一份程序跑不同型号的 GPU</title>
  <desc id="fig-cuda-programming-1-10-desc">同一份程序要能跑在高端的 16 核 GPU 上，也要能跑在中端的 6 核 GPU 上；编译负责把线程块映射到实际可用的核上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">编译要解决的兼容问题：一份程序跑不同型号的 GPU</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一份程序要能跑在不同型号的 GPU 上</text>
  <rect x="25" y="138" width="225" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137.5" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">高端 GPU</text>
  <text x="137.5" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">16 个核</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">中端 GPU</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">6 个核</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">同一个内核</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">不同核数</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">编译把线程块映射到实际可用的核上</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">程序里写的是块的个数，不是核的个数</text>
</svg>
