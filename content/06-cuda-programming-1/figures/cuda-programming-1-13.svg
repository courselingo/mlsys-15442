<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 447.0" width="758" height="447.0"
     role="img" aria-labelledby="fig-cuda-programming-1-13-title fig-cuda-programming-1-13-desc">
  <title id="fig-cuda-programming-1-13-title">把一个内核跑到 GPU 上，调度器按四步走</title>
  <desc id="fig-cuda-programming-1-13-desc">内核先被送到设备，调度器把线程块映射到核上并占住执行上下文与共享内存，核满了就让后来的块排队，块结束后腾出的位置交给下一个块。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="447.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把一个内核跑到 GPU 上，调度器按四步走</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">把一个内核跑到 GPU 上：调度器做的事</text>
  <rect x="25" y="138" width="500" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="275.0" y="170.9" font-size="14" fill="#b45309" text-anchor="middle">第一步 把内核送到设备</text>
  <rect x="25" y="219" width="500" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="275.0" y="251.9" font-size="14" fill="#b45309" text-anchor="middle">第二步 把块映射到核上，占住上下文与共享内存</text>
  <rect x="25" y="300" width="500" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="275.0" y="332.9" font-size="14" fill="#b45309" text-anchor="middle">第三步 核满了就排队等，直到有块结束</text>
  <rect x="25" y="381" width="500" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="275.0" y="413.9" font-size="14" fill="#b45309" text-anchor="middle">第四步 块结束后腾出的位置交给下一个块</text>
</svg>
