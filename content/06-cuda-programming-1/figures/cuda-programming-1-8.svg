<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-cuda-programming-1-8-title fig-cuda-programming-1-8-desc">
  <title id="fig-cuda-programming-1-8-title">例子：把一维卷积从朴素写法改成用共享内存</title>
  <desc id="fig-cuda-programming-1-8-desc">每个输出是相邻三个输入的均值；朴素写法让每个线程直接读全局内存，改进版先把要用的一段读进共享内存再算，两者算的是同一件事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">例子：把一维卷积从朴素写法改成用共享内存</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一维卷积：每个输出是相邻三个输入的均值</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">版本一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">每个线程直接读全局内存</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">版本二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">先把要用的一段读进共享内存</text>
  <rect x="25" y="234" width="686" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="368.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两者算的是同一件事</text>
  <text x="368.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">差别只在读了几次全局内存</text>
</svg>
