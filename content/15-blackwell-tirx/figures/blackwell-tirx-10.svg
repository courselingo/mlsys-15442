<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-10-title fig-blackwell-tirx-10-desc">
  <title id="fig-blackwell-tirx-10-title">第 1 步：同步版</title>
  <desc id="fig-blackwell-tirx-10-desc">起点是一版完全同步的内核：加载、矩阵乘、写回三件事依次做，中间还要等所有线程到齐；课件把它作为十步路径的基准。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第 1 步：同步版</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">第 1 步：同步加载 + 矩阵乘 + 同步写回</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">三件事依次做，用同步隔开</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">特点</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">好懂，但硬件大部分时间在等</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">后面九步都在拆掉这些「等」</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而每一步只改一件事</text>
</svg>
