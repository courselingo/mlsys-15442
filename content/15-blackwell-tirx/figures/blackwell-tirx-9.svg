<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 430.0" width="826" height="430.0"
     role="img" aria-labelledby="fig-blackwell-tirx-9-title fig-blackwell-tirx-9-desc">
  <title id="fig-blackwell-tirx-9-title">TIRx 给的三个机制</title>
  <desc id="fig-blackwell-tirx-9-desc">课件说 TIRx 提供了一个一等机制，叫确定性的算子派发；它由三部分组成：张量上显式标注布局、显式的执行作用域、以及确定性的派发规则。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="430.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">TIRx 给的三个机制</text>
  <rect x="25" y="70" width="620" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="335.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">机制一 显式布局</text>
  <text x="335.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">swizzle 与分块直接标在张量上</text>
  <rect x="25" y="163" width="620" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="335.0" y="192.7" font-size="15" fill="#b45309" text-anchor="middle">机制二 执行作用域</text>
  <text x="335.0" y="210.7" font-size="12" fill="#b45309" text-anchor="middle">内核、CTA、warp 组、warp、线程各自明确</text>
  <rect x="25" y="256" width="620" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="335.0" y="285.7" font-size="15" fill="#b45309" text-anchor="middle">机制三 确定性派发</text>
  <text x="335.0" y="303.7" font-size="12" fill="#b45309" text-anchor="middle">同一个算子每次都落到同一段实现</text>
  <rect x="25" y="352" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="381.7" font-size="15" fill="#6b21a8" text-anchor="middle">前两个机制解决「写不出来」，第三个解决「结果不稳定」</text>
  <text x="415.0" y="399.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件特别区分了人与智能体两类使用者</text>
</svg>
