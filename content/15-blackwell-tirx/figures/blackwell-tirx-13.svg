<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-13-title fig-blackwell-tirx-13-desc">
  <title id="fig-blackwell-tirx-13-title">第 9 步：把两个 SM 连起来</title>
  <desc id="fig-blackwell-tirx-13-desc">课件的说法是相邻的两个 SM 可以互读对方的共享内存；一次矩阵乘可以从两个 CTA 的共享内存里取数，结果则分布在两边的张量内存里，合起来是 256 乘 256。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第 9 步：把两个 SM 连起来</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">第 9 步：两个 CTA 组成一个簇</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">共享内存那侧</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">相邻 SM 可以互读对方的共享内存</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">结果那侧</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">两边各 128 行，合起来 256 乘 256</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件注明 CTA-0 驱动两边的矩阵乘，CTA-1 的引擎是闲的</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">分工不对等，但换来的是每个共享内存块的产出翻倍</text>
</svg>
