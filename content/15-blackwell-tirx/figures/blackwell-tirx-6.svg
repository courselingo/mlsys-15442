<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-6-title fig-blackwell-tirx-6-desc">
  <title id="fig-blackwell-tirx-6-title">MBarrier：一个 64 位的同步对象</title>
  <desc id="fig-blackwell-tirx-6-desc">课件给的结构有四项：当前相位（0 或 1）、还差几次到达、每相位期望的到达次数、以及待完成的异步字节数；相位完成的条件是到达数与字节数都清零。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">MBarrier：一个 64 位的同步对象</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">MBarrier 的四个字段</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">与线程有关的两项</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">当前相位、还差几次到达</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">与数据有关的两项</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">期望到达次数、待完成字节数</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">相位完成的条件是两项同时满足</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">完成后它会自动复位，并翻转相位</text>
</svg>
