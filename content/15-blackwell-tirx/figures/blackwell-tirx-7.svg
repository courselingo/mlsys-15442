<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-7-title fig-blackwell-tirx-7-desc">
  <title id="fig-blackwell-tirx-7-title">相位翻转：让屏障可以被反复使用</title>
  <desc id="fig-blackwell-tirx-7-desc">课件讲了相位机制要解决的问题：在循环里同一个屏障每一轮都要用一次，那么「这一次触发的是第 i 轮还是第 i-1 轮」就必须能被区分出来。翻转相位就是在回答这个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">相位翻转：让屏障可以被反复使用</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">相位机制解决的问题：这一次是哪一轮</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">每完成一次</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">相位翻转，计数复位</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">于是不需要重新初始化</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">这在 K 循环里很关键</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的写法是每轮读完之后把相位变量异或一次</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">代码里就一行，但它决定了对不对</text>
</svg>
