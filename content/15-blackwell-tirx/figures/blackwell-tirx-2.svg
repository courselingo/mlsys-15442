<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-2-title fig-blackwell-tirx-2-desc">
  <title id="fig-blackwell-tirx-2-title">一个 SM 里有什么</title>
  <desc id="fig-blackwell-tirx-2-desc">课件的架构图列出这些单元：张量核心（tcgen05，第五代矩阵乘加）、CUDA 核心、每个 SM 228 KB 共享内存、128 条通道的张量内存、寄存器堆、TMA 引擎，以及外部的全局内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个 SM 里有什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">Blackwell 的一个流多处理器</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">算的部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">张量核心 tcgen05、CUDA 核心</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">存与搬的部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">228 KB 共享内存、128 通道张量内存、TMA 引擎</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件用实线画加载路径、虚线画写回路径</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">两条路径分开画，是因为它们在这一代是异步的</text>
</svg>
