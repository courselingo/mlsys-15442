<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-12-title fig-blackwell-tirx-12-desc">
  <title id="fig-blackwell-tirx-12-title">第 7 步：让三件事同时进行</title>
  <desc id="fig-blackwell-tirx-12-desc">课件把这一步讲得很清楚：在第 4 步里加载与计算是串行的，硬件有一半时间闲着；到第 7 步把角色分开之后，搬数据、算、写回三者可以同时进行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第 7 步：让三件事同时进行</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">第 7 步：warp 专用化，让三件事重叠</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">改之前</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">加载与计算串行，硬件约一半时间空闲</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">改之后</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">TMA、矩阵乘、写回各由一组 warp 负责</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件还列了四组屏障的职责</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">数据就绪、缓冲可复用、累加完成、读走完成，各由一种屏障承担</text>
</svg>
