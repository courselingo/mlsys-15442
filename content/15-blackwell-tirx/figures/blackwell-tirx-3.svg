<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-3-title fig-blackwell-tirx-3-desc">
  <title id="fig-blackwell-tirx-3-title">GEMM 在这套硬件上的数据通路</title>
  <desc id="fig-blackwell-tirx-3-desc">课件把一次矩阵乘的每一步都标在架构图上：A 与 B 从全局内存经 TMA 进共享内存，张量核心从共享内存取数、把累加结果写进张量内存，再由寄存器取回、转换、写回共享内存，最后经 TMA 写回全局内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">GEMM 在这套硬件上的数据通路</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一次矩阵乘：从全局内存到全局内存</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">进去的一段</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">TMA 搬 A 与 B 进共享内存</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">算与回来的一段</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">张量核心累加到张量内存，再经寄存器写回</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条通路比前面几讲见过的都长</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件标成新增的是张量内存</text>
</svg>
