<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-blackwell-tirx-8-title fig-blackwell-tirx-8-desc">
  <title id="fig-blackwell-tirx-8-title">为什么需要原生级访问</title>
  <desc id="fig-blackwell-tirx-8-desc">课件先问了一个问题：为什么在 FlashAttention 出现之前，机器学习编译器没能生成出那种内核。它给的答案有两面，一面是工作负载与硬件的演进快过 DSL 的适配，另一面是使用者无法在 DSL 里表达最好的优化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么需要原生级访问</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一个尖锐的问题：编译器为什么没先做出来</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">一面是硬件</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">新特性一代一代出，DSL 跟不上</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">另一面是表达力</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">最好的优化在 DSL 里写不出来</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件也承认现状：最强的内核仍然常常是 CUDA 写的，或用 CUTLASS 搭的</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它还提到原生优先的 DSL 正在起来，比如 Gluon 与 CuTeDSL</text>
</svg>
