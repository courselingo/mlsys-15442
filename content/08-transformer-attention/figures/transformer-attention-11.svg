<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 762 244.0" width="762" height="244.0"
     role="img" aria-labelledby="fig-transformer-attention-11-title fig-transformer-attention-11-desc">
  <title id="fig-transformer-attention-11-title">warp 这一层：切查询，不要切键值</title>
  <desc id="fig-transformer-attention-11-desc">把一个线程块再分给各个 warp 时，沿键值切会要求各 warp 把结果加回来，也就是需要通信；沿查询切则各算各的，不需要通信。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="762" height="244.0" fill="#ffffff"/>

  <text x="383.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">warp 这一层：切查询，不要切键值</text>
  <rect x="25" y="70" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">沿键值切</text>
  <text x="195.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">各 warp 要把结果加起来</text>
  <rect x="393" y="70" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="99.7" font-size="15" fill="#166534" text-anchor="middle">沿查询切</text>
  <text x="563.0" y="117.7" font-size="12" fill="#166534" text-anchor="middle">各算各的，不用通信</text>
  <rect x="25" y="166" width="716" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="383.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">所以选沿查询切</text>
  <text x="383.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件给的收益是 2 到 4 倍加速、10 到 20 倍显存下降</text>
</svg>
