<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-transformer-attention-8-title fig-transformer-attention-8-desc">
  <title id="fig-transformer-attention-8-title">分块之后，softmax 要能在小块上滚动着算</title>
  <desc id="fig-transformer-attention-8-desc">小块一块一块处理时，全局的最大值与分母还不知道；做法是维护一个当前最大值与一个累计分母，每来一块就按新的最大值把之前的结果缩放一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分块之后，softmax 要能在小块上滚动着算</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">在线 softmax：一边看新块，一边修正旧结果</text>
  <rect x="25" y="138" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="137.5" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">为什么要这样</text>
  <text x="137.5" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">分块时看不到全部</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">维护什么</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">当前最大值与累计分母</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">每来一块</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">按新最大值缩放旧结果</text>
  <rect x="25" y="234" width="760" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="405.0" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">还有一处硬约束：16 位浮点的最大值只有 65504</text>
  <text x="405.0" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">所以要先减最大值再取指数，否则直接溢出</text>
</svg>
