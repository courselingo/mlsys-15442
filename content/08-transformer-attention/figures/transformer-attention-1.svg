<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 782 244.0" width="782" height="244.0"
     role="img" aria-labelledby="fig-transformer-attention-1-title fig-transformer-attention-1-desc">
  <title id="fig-transformer-attention-1-title">这一讲分两半，由一件事串起来</title>
  <desc id="fig-transformer-attention-1-desc">前半讲注意力是什么、它在 GPU 上为什么贵；后半讲两种优化。两半由同一件事串起来：注意力的中间结果随序列长度平方增长。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="782" height="244.0" fill="#ffffff"/>

  <text x="393.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲分两半，由一件事串起来</text>
  <rect x="25" y="70" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">前半</text>
  <text x="195.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">注意力是什么，为什么贵</text>
  <rect x="393" y="70" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">后半</text>
  <text x="563.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">两种优化，以及推理期的新问题</text>
  <rect x="25" y="166" width="736" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="393.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">串起两半的是同一件事</text>
  <text x="393.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">注意力的中间结果随序列长度平方增长</text>
</svg>
