<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -1.0 758 376.0" width="758" height="376.0"
     role="img" aria-labelledby="fig-transformer-attention-7-title fig-transformer-attention-7-desc">
  <title id="fig-transformer-attention-7-title">FlashAttention 靠两件事减少全局显存的访问</title>
  <desc id="fig-transformer-attention-7-desc">技术一是分块：把 Q、K、V 一块一块搬进共享内存，在片上算；技术二是重算：前向不存那个 N×N 的注意力矩阵，反向时再算一遍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="-1.0" width="758" height="376.0" fill="#ffffff"/>

  <text x="381.0" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">FlashAttention 靠两件事减少全局显存的访问</text>
  <rect x="25" y="56" width="712" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="38" y="73.85" font-size="11" fill="#64748b">FlashAttention 的两个技术</text>
  <rect x="45" y="95" width="672" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="381.0" y="127.9" font-size="14" fill="#b45309" text-anchor="middle">技术一 分块：把 Q、K、V 一块一块搬进共享内存</text>
  <rect x="45" y="176" width="672" height="56" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="381.0" y="208.9" font-size="14" fill="#b45309" text-anchor="middle">技术二 重算：前向不存注意力矩阵，反向再算一遍</text>
  <rect x="25" y="284" width="712" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="313.7" font-size="15" fill="#166534" text-anchor="middle">结果是精确的，不是近似</text>
  <text x="381.0" y="331.7" font-size="12" fill="#166534" text-anchor="middle">它只换了一种算的顺序，没有换算法</text>
</svg>
