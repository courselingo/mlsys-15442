<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-transformer-attention-2-title fig-transformer-attention-2-desc">
  <title id="fig-transformer-attention-2-title">注意力：用权重把若干状态组合起来</title>
  <desc id="fig-transformer-attention-2-desc">课件给的定义是把各个状态按权重组合起来；权重不是人给的，而是由当前这一步的查询与各状态的键匹配出来的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">注意力：用权重把若干状态组合起来</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">注意力：把若干状态按权重组合起来</text>
  <rect x="25" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="89.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">状态 1</text>
  <text x="89.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">来自上一层</text>
  <rect x="181" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="245.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">状态 2</text>
  <text x="245.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">来自上一层</text>
  <rect x="337" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="401.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">状态 3</text>
  <text x="401.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">来自上一层</text>
  <rect x="493" y="138" width="128" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="557.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">状态 4</text>
  <text x="557.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">来自上一层</text>
  <rect x="25" y="234" width="596" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="323.0" y="263.7" font-size="15" fill="#166534" text-anchor="middle">每个状态乘一个权重再相加</text>
  <text x="323.0" y="281.7" font-size="12" fill="#166534" text-anchor="middle">权重来自查询与键的匹配程度</text>
</svg>
