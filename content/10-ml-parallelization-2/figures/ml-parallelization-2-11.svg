<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-11-title fig-ml-parallelization-2-11-desc">
  <title id="fig-ml-parallelization-2-11-title">提高流水线效率：动小批次，还是动微批次</title>
  <desc id="fig-ml-parallelization-2-11-desc">课件给的两条路是加大小批次、或者减小微批次；前者让每个微批次的计算变多，后者让微批次变多，两种都能把填充阶段的占比压下去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">提高流水线效率：动小批次，还是动微批次</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">两条路，目标都是把填充阶段摊薄</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">加大小批次</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每个微批次的计算量变大</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">减小微批次</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">微批次数变多，流水线更满</text>
  <rect x="25" y="234" width="700" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="375.0" y="263.7" font-size="15" fill="#9d174d" text-anchor="middle">但两条路都有上限</text>
  <text x="375.0" y="281.7" font-size="12" fill="#9d174d" text-anchor="middle">前者受显存限制，后者受通信开销限制</text>
</svg>
