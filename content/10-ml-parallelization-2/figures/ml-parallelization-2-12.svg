<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 340.0" width="777" height="340.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-12-title fig-ml-parallelization-2-12-desc">
  <title id="fig-ml-parallelization-2-12-title">流水线的显存问题：中间结果要全留着</title>
  <desc id="fig-ml-parallelization-2-12-desc">反向传播之前，所有微批次的中间激活值都得留着；微批次越多，占的显存越大。课件引 GPipe 这一页来问：能不能改调度把显存降下来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="340.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">流水线的显存问题：中间结果要全留着</text>
  <rect x="25" y="70" width="712" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">反向传播之前，中间激活值必须全部留着</text>
  <text x="381.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">微批次越多，要留的份数越多</text>
  <rect x="25" y="166" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">为什么会这样</text>
  <text x="195.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">朴素调度要等全部前向做完</text>
  <rect x="393" y="166" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="195.7" font-size="15" fill="#b45309" text-anchor="middle">课件引的是</text>
  <text x="563.0" y="213.7" font-size="12" fill="#b45309" text-anchor="middle">GPipe 那份工作</text>
  <rect x="25" y="262" width="731" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.5" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是问题变成：能不能换一种调度</text>
  <text x="390.5" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">让显存不用跟着微批次数一起涨</text>
</svg>
