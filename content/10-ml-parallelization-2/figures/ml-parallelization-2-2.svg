<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-2-title fig-ml-parallelization-2-2-desc">
  <title id="fig-ml-parallelization-2-2-title">回顾：数据并行做了什么，卡在哪</title>
  <desc id="fig-ml-parallelization-2-2-desc">数据并行把训练集切开，每块卡留一份完整模型，算完把梯度汇总；它卡在「每块卡都要装下整个模型」这一条上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">回顾：数据并行做了什么，卡在哪</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">数据并行：切数据，复制模型</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">它擅长什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">改动小，扩展性好</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">它卡在哪</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">装不下超过单卡显存的模型</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">加卡能加算力，但加不了一块卡的显存</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以需要一种不复制模型的切法</text>
</svg>
