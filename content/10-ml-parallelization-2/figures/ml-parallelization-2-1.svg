<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 340.0" width="758" height="340.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-1-title fig-ml-parallelization-2-1-desc">
  <title id="fig-ml-parallelization-2-1-title">上一讲留下的墙，这一讲从模型这一侧绕</title>
  <desc id="fig-ml-parallelization-2-1-desc">数据并行解决不了「模型装不下」，因为它复制模型；这一讲改从模型这一侧切，先切层与层之间，再切层内部，最后把两种切法叠起来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="340.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">上一讲留下的墙，这一讲从模型这一侧绕</text>
  <rect x="25" y="70" width="712" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">复制的思路走到了尽头</text>
  <text x="381.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">每块卡都要装下一份完整模型</text>
  <rect x="25" y="166" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">换个方向</text>
  <text x="195.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">把模型本身切开</text>
  <rect x="393" y="166" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="195.7" font-size="15" fill="#166534" text-anchor="middle">最后</text>
  <text x="563.0" y="213.7" font-size="12" fill="#166534" text-anchor="middle">两种切法叠起来用</text>
  <rect x="25" y="262" width="712" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="381.0" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一讲按「切得越来越细」推进</text>
  <text x="381.0" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">层与层之间、层内部、再把两者组合</text>
</svg>
