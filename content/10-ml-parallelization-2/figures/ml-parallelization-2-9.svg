<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 782 312.0" width="782" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-9-title fig-ml-parallelization-2-9-desc">
  <title id="fig-ml-parallelization-2-9-title">流水线并行：把一个小批次拆成多个微批次</title>
  <desc id="fig-ml-parallelization-2-9-desc">课件先定义小批次是每次迭代处理的样本数，做法是把它拆成若干个微批次，让不同设备同时处理不同微批次，于是大家都有活干。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="782" height="312.0" fill="#ffffff"/>

  <text x="393.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">流水线并行：把一个小批次拆成多个微批次</text>
  <rect x="25" y="70" width="700" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="375.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">流水线并行：把一个小批次拆成多个微批次</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">小批次</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每次迭代处理的样本数</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">拆成微批次</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">各设备同时处理不同的微批次</text>
  <rect x="25" y="234" width="736" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="393.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">设备不再排队等，而是像流水线一样错开</text>
  <text x="393.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">代价是同一时刻有多个微批次在飞</text>
</svg>
