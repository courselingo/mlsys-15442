<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 754 260.0" width="754" height="260.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-10-title fig-ml-parallelization-2-10-desc">
  <title id="fig-ml-parallelization-2-10-title">课件用两个符号描述流水线的效率</title>
  <desc id="fig-ml-parallelization-2-10-desc">I 是一个小批次里的微批次数，L 是流水线的级数；课件给出的稳态利用率与这两个量的比值有关，微批次数相对于级数越多，填满流水线就越容易。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="754" height="260.0" fill="#ffffff"/>

  <text x="379.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">课件用两个符号描述流水线的效率</text>
  <rect x="25" y="70" width="300" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="175.0" y="99.7" font-size="15" fill="#1e40af" text-anchor="middle">I</text>
  <text x="175.0" y="117.7" font-size="12" fill="#1e40af" text-anchor="middle">一个小批次里的微批次数</text>
  <rect x="25" y="163" width="300" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="175.0" y="192.7" font-size="15" fill="#b45309" text-anchor="middle">L</text>
  <text x="175.0" y="210.7" font-size="12" fill="#b45309" text-anchor="middle">流水线的级数</text>
  <rect x="353" y="70" width="380" height="180" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="543.0" y="146.7" font-size="15" fill="#6b21a8" text-anchor="middle">为什么要看这两个量</text>
  <text x="543.0" y="164.7" font-size="12" fill="#6b21a8" text-anchor="middle">流水线要先填满才有稳态</text>
  <text x="543.0" y="182.7" font-size="12" fill="#6b21a8" text-anchor="middle">填充阶段各设备还在等</text>
</svg>
