<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-14-title fig-ml-parallelization-2-14-desc">
  <title id="fig-ml-parallelization-2-14-title">交错式 1F1B：把每一级再切成子级</title>
  <desc id="fig-ml-parallelization-2-14-desc">做法是把每个流水线级进一步切成 R 个子级，让原本属于同一级的计算分散开；课件的分析指出这样能把填充阶段进一步压小。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">交错式 1F1B：把每一级再切成子级</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">交错式 1F1B：每一级再切成 R 个子级</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">一级拆成多个子级，交错排布</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">目的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">把填充阶段的空档再压小</text>
  <rect x="25" y="234" width="680" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="365.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件把它与前面的调度放在一起比较</text>
  <text x="365.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">三者是逐步改进的关系</text>
</svg>
