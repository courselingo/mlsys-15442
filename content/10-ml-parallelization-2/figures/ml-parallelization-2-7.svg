<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-7-title fig-ml-parallelization-2-7-desc">
  <title id="fig-ml-parallelization-2-7-title">Transformer 的一层由两种层组成，切法各有一套</title>
  <desc id="fig-ml-parallelization-2-7-desc">一层 Transformer 里既有全连接层也有自注意力层；课件把两层分别拆开讲，最后引到 Megatron-LM 的组合做法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Transformer 的一层由两种层组成，切法各有一套</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一层 Transformer = 全连接层 + 自注意力层</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">全连接层</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">按列切第一层、按行切第二层</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">自注意力层</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">按头切开，各头独立算</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">Megatron-LM 把这两种切法组合起来</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">课件给的规模是 512 块 GPU，靠数据并行与模型并行叠出来</text>
</svg>
