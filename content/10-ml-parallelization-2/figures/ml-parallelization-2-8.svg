<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 810 340.0" width="810" height="340.0"
     role="img" aria-labelledby="fig-ml-parallelization-2-8-title fig-ml-parallelization-2-8-desc">
  <title id="fig-ml-parallelization-2-8-title">模型并行自己的问题：大部分设备在等</title>
  <desc id="fig-ml-parallelization-2-8-desc">按层顺序切分时，同一时刻只有一台设备在工作，其余都在等上一步的结果；课件把它叫作计算资源的低利用率，整体吞吐也因此上不去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="810" height="340.0" fill="#ffffff"/>

  <text x="407.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">模型并行自己的问题：大部分设备在等</text>
  <rect x="25" y="70" width="712" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="99.7" font-size="15" fill="#9d174d" text-anchor="middle">同一时刻只有一台设备在工作</text>
  <text x="381.0" y="117.7" font-size="12" fill="#9d174d" text-anchor="middle">其余设备在等上一步的输出</text>
  <rect x="25" y="166" width="170" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">操作 1</text>
  <text x="110.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">设备 1</text>
  <rect x="223" y="166" width="170" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="308.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">操作 2</text>
  <text x="308.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">设备 2</text>
  <rect x="421" y="166" width="170" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="506.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">操作 3</text>
  <text x="506.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">设备 3</text>
  <rect x="619" y="166" width="170" height="68" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="704.0" y="195.7" font-size="15" fill="#1e40af" text-anchor="middle">操作 4</text>
  <text x="704.0" y="213.7" font-size="12" fill="#1e40af" text-anchor="middle">设备 4</text>
  <rect x="25" y="262" width="712" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="381.0" y="291.7" font-size="15" fill="#6b21a8" text-anchor="middle">课件给的结论是利用率低、整体吞吐低</text>
  <text x="381.0" y="309.7" font-size="12" fill="#6b21a8" text-anchor="middle">要解决它，得让后面的设备提前忙起来</text>
</svg>
