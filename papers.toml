# CourseLingo 论文登记表
#
# 为什么要单独一张表：**每篇论文的授权都不一样**（USENIX / ACM / IEEE / 技术报告），
# 不能用课程级的一个布尔表示。翻译全文是「复制整篇表达」的衍生作品，
# 风险与翻译逐字稿同级，因此必须**逐篇**核实。
#
# ★ 规则：
#   - output_mode = "guide"        → 我们自己写的导读，任何时候都可以做
#   - output_mode = "translation"  → 全文翻译，必须 verified = true **且** allows_translation = true
#
# 「网上能免费下载」≠「可以翻译」。作者把 PDF 挂在自己主页上，**没有授予任何许可**，
# 法律状态仍是保留所有权利。只有明确的许可条款（例如 CC BY）或书面授权才算数。

